<!DOCTYPE html>
<html class="light" lang="ko">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>커스텀 연산 시뮬레이터</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎯</text></svg>">
    <link href="css/tailwind.css" rel="stylesheet" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link as="style" crossorigin="" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet" />

    <style>
        body {
            font-family: 'Pretendard', sans-serif;
            background-color: #F9FAFB;
            color: #111827;
        }

        .custom-scrollbar::-webkit-scrollbar { width: 5px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #D1D5DB; border-radius: 20px; }

        .card {
            background: white;
            border-radius: 20px;
            border: 1px solid #F3F4F6;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.02);
            transition: all 0.2s ease;
        }
        .card:hover { transform: translateY(-2px); box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05); }

        .card-header {
            padding: 20px 24px;
            border-bottom: 1px solid #F3F4F6;
            display: flex;
            align-items: center;
            gap: 10px;
            border-radius: 20px 20px 0 0;
        }

        .connected-tab {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            font-weight: 600;
            font-size: 0.85rem;
            color: #6B7280;
            border-radius: 9999px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .connected-tab-active {
            background-color: #1F2937 !important;
            color: white !important;
        }

        .ball-common {
            display: inline-flex;
            width: 28px;
            height: 28px;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            color: white;
            font-weight: 700;
            font-size: 12px;
            box-shadow: inset 0 -2px 4px rgba(0, 0, 0, 0.15);
            text-shadow: 0 1px 1px rgba(0, 0, 0, 0.1);
            margin: 1px;
        }

        .ball-y { background: linear-gradient(135deg, #f59e0b, #d97706); }
        .ball-b { background: linear-gradient(135deg, #3b82f6, #2563eb); }
        .ball-r { background: linear-gradient(135deg, #ef4444, #dc2626); }
        .ball-g { background: linear-gradient(135deg, #6b7280, #4b5563); }
        .ball-gr { background: linear-gradient(135deg, #10b981, #059669); }

        /* Formula Input Style */
        .formula-input {
            font-family: 'Fira Code', monospace;
            background: #F3F4F6;
            border: 2px solid #E5E7EB;
            border-radius: 12px;
            padding: 12px;
            width: 100%;
            font-size: 1.1rem;
            color: #1F2937;
            transition: border-color 0.2s;
        }
        .formula-input:focus { border-color: #6366F1; outline: none; }

        .btn-primary {
            background: #4F46E5;
            color: white;
            padding: 10px 20px;
            border-radius: 12px;
            font-weight: 600;
            transition: background 0.2s;
        }
        .btn-primary:hover { background: #4338CA; }

        .table-container {
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #E5E7EB;
        }

        /* 럭셔리 카드 뱃지 */
        .badge-indigo { background: #EEF2FF; color: #4F46E5; padding: 2px 8px; border-radius: 6px; font-size: 11px; font-weight: 700; }
        
        .hit-high { color: #059669; font-weight: 800; }
        .hit-mid { color: #D97706; font-weight: 700; }
        .hit-low { color: #9CA3AF; }
    </style>
</head>

<body class="text-slate-900 h-screen flex flex-col font-sans">
    <div id="gnb-container"></div>

    <main class="flex-1 overflow-hidden flex flex-col w-full mx-auto px-4 pt-8 pb-4 max-w-7xl">
        <header class="mb-6 shrink-0">
            <div class="flex items-end justify-between mb-5">
                <div class="flex items-center gap-3">
                    <span class="material-symbols-outlined text-3xl text-indigo-600">science</span>
                    <div>
                        <h1 class="text-2xl font-black text-gray-900 tracking-tight">커스텀 연산 시뮬레이터</h1>
                        <p class="text-xs text-gray-500 mt-0.5">나만의 수식으로 검증하는 로또 전략</p>
                    </div>
                </div>
            </div>

            <div class="flex border-b border-gray-200 pb-1 gap-1">
                <button onclick="CustomSim.switchTab('simulator')" id="btn-simulator" class="connected-tab connected-tab-active">
                    <span class="material-symbols-outlined text-sm">precision_manufacturing</span> 시뮬레이터
                </button>
                <button onclick="CustomSim.switchTab('dashboard')" id="btn-dashboard" class="connected-tab">
                    <span class="material-symbols-outlined text-sm">dashboard</span> 저장된 필터
                </button>
            </div>
        </header>

        <section id="content-area" class="flex-1 overflow-y-auto custom-scrollbar">
            <!-- 1. 시뮬레이터 탭 -->
            <div id="tab-simulator" class="space-y-6 pb-10">
                <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                    <!-- 설정 카드 -->
                    <div class="card lg:col-span-1">
                        <div class="card-header">
                            <span class="material-symbols-outlined text-blue-500">settings</span>
                            <h3 class="font-bold text-sm">시뮬레이션 설정</h3>
                        </div>
                        <div class="card-body space-y-5">
                            <div>
                                <label class="block text-[10px] font-bold text-gray-400 mb-2 uppercase tracking-wider">대상 데이터베이스</label>
                                <select id="dbSelect" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-2.5 text-sm font-semibold focus:ring-2 focus:ring-indigo-500 outline-none">
                                    <option value="korea">동행복권 (한국 6/45)</option>
                                    <optgroup label="해외 로또" id="globalLottoGroup"></optgroup>
                                </select>
                            </div>
                            <div>
                                <label class="block text-[10px] font-bold text-gray-400 mb-2 uppercase tracking-wider">슬라이딩 윈도우 (N회차)</label>
                                <div class="flex items-center gap-4">
                                    <input type="range" id="windowSlider" min="1" max="10" value="3" class="flex-1 h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer accent-indigo-600">
                                    <span id="windowDisplay" class="text-lg font-black text-indigo-600 w-6">3</span>
                                </div>
                                <p class="text-[10px] text-gray-400 mt-2">최근 N회차의 당첨번호 합집합을 기준으로 시뮬레이션합니다.</p>
                            </div>
                        </div>
                    </div>

                    <!-- 수식 입력 카드 -->
                    <div class="card lg:col-span-2">
                        <div class="card-header">
                            <span class="material-symbols-outlined text-purple-500">functions</span>
                            <h3 class="font-bold text-sm">수식 정의</h3>
                            <button onclick="CustomSim.showGuide()" class="ml-auto text-[10px] text-indigo-600 font-bold hover:underline">수식 가이드</button>
                        </div>
                        <div class="card-body">
                            <input type="text" id="formulaInput" class="formula-input mb-4" placeholder="예: N-1[1] + N-2[3] - drawNo.digitSum" value="N-1[1] + N-1[2]">
                            <div class="flex gap-3">
                                <button onclick="CustomSim.run()" class="btn-primary flex-1 text-sm">
                                    <span class="material-symbols-outlined text-[18px] align-middle mr-1">play_arrow</span> 시뮬레이션 실행
                                </button>
                                <button onclick="CustomSim.saveFilter()" class="bg-emerald-500 hover:bg-emerald-600 text-white px-6 py-2.5 rounded-xl font-bold transition-all text-sm">
                                    <span class="material-symbols-outlined text-[18px] align-middle mr-1">bookmark</span> 필터 저장
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 결과 리스트 -->
                <div id="resultCard" class="card hidden">
                    <div class="card-header flex justify-between">
                        <div class="flex items-center gap-2">
                            <span class="material-symbols-outlined text-amber-500">analytics</span>
                            <h3 class="font-bold text-sm">시뮬레이션 결과 (행렬)</h3>
                        </div>
                        <div class="flex items-center gap-4">
                            <div class="text-right">
                                <span class="text-[10px] text-gray-400 font-bold uppercase">평균 Hit율</span>
                                <div class="text-xl font-black text-indigo-600" id="avgHitRate">- %</div>
                            </div>
                        </div>
                    </div>
                    <div class="card-body overflow-x-auto">
                        <table class="w-full text-sm">
                            <thead>
                                <tr class="bg-gray-50 border-b border-gray-100">
                                    <th class="px-4 py-3 text-left text-[11px] text-gray-400 uppercase font-bold">회차</th>
                                    <th class="px-4 py-3 text-left text-[11px] text-gray-400 uppercase font-bold">대상 번호 (합집합)</th>
                                    <th class="px-4 py-3 text-left text-[11px] text-gray-400 uppercase font-bold">실제 당첨</th>
                                    <th class="px-4 py-3 text-center text-[11px] text-gray-400 uppercase font-bold">Hit</th>
                                    <th class="px-4 py-3 text-center text-[11px] text-gray-400 uppercase font-bold">적중률</th>
                                </tr>
                            </thead>
                            <tbody id="resultBody" class="divide-y divide-gray-50">
                                <!-- Dynamic rows -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- 2. 대시보드 탭 -->
            <div id="tab-dashboard" class="hidden pb-10">
                <div id="dashboardGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                    <!-- Filter Cards -->
                    <div class="col-span-full py-20 text-center text-gray-400" id="emptyDashboard">
                        <span class="material-symbols-outlined text-5xl mb-4">folder_off</span>
                        <p>저장된 커스텀 필터가 없습니다.</p>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- 로딩 오버레이 -->
    <div id="loadingOverlay" class="fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-[9999] hidden flex flex-col items-center justify-center">
        <div class="w-16 h-16 border-4 border-indigo-500/30 border-t-indigo-500 rounded-full animate-spin mb-4"></div>
        <p class="text-white font-bold animate-pulse">연산 엔진 가동 중...</p>
    </div>

    <!-- SDK & Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/common_v2.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/customSimulator.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (window.Layout) window.Layout.init();
            if (window.CustomSim) window.CustomSim.init();
        });
    </script>
</body>
</html>
