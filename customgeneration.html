<!DOCTYPE html>
<html class="light" lang="ko">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI 분석 메뉴 생성기</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    
    <link rel="icon" href="data:,">

    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
        rel="stylesheet" />
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="js/common_v2.js"></script>

    <style>
        body {
            font-family: 'Pretendard', sans-serif;
        }

        .chat-bubble {
            max-width: 80%;
            padding: 10px 14px;
            border-radius: 12px;
            margin-bottom: 10px;
            font-size: 14px;
            line-height: 1.5;
        }

        .chat-user {
            background-color: #3b82f6;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }

        .chat-ai {
            background-color: #f3f4f6;
            color: #1f2937;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
            border: 1px solid #e5e7eb;
        }

        .preview-table th,
        .preview-table td {
            border: 1px solid #e2e8f0;
            padding: 8px;
            font-size: 12px;
            text-align: center;
        }

        .preview-table th {
            background-color: #f8fafc;
            font-weight: 700;
            color: #475569;
        }
    </style>
</head>

<body class="bg-gray-100 h-screen flex flex-col overflow-hidden">

    <header class="bg-white border-b border-gray-200 px-6 py-4 flex items-center justify-between shrink-0">
        <div>
            <h1 class="text-xl font-bold text-gray-900">✨ AI 커스텀 분석 생성기</h1>
            <p class="text-xs text-gray-500">말로 명령하면 표와 필터를 자동으로 만들어줍니다.</p>
        </div>
        <div class="flex gap-2">
            <button onclick="window.close()"
                class="px-4 py-2 text-sm text-gray-600 hover:bg-gray-50 rounded-lg">닫기</button>
            <button onclick="saveAnalysis()" id="saveBtn"
                class="px-4 py-2 text-sm font-bold text-white bg-green-600 hover:bg-green-700 rounded-lg disabled:opacity-50 disabled:cursor-not-allowed"
                disabled>
                분석 메뉴 저장하기
            </button>
        </div>
    </header>

    <div class="flex flex-1 overflow-hidden">
        <aside class="w-1/3 bg-white border-r border-gray-200 flex flex-col relative z-10 shadow-lg">
            <div id="chatHistory" class="flex-1 overflow-y-auto p-4 flex flex-col bg-slate-50">
                <div class="chat-bubble chat-ai">
                    안녕하세요! 👋<br>
                    어떤 분석을 만들고 싶으신가요?<br><br>
                    예시)<br>
                    - "전회차 당번에서 +1 한 숫자들을 보여주고 적중률 알려줘"<br>
                    - "최근 10회차 미출현 번호만 뽑아서 보여줘"<br>
                    - "당첨번호 6개의 합계를 계산해서 표로 보여줘"
                </div>
            </div>

            <div class="p-4 bg-white border-t border-gray-200">
                <textarea id="userPrompt"
                    class="w-full border border-gray-300 rounded-lg p-3 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none resize-none"
                    rows="3" placeholder="여기에 명령어를 입력하세요... (Enter로 전송)"></textarea>
                <button onclick="sendPrompt()" id="sendBtn"
                    class="w-full mt-2 bg-blue-600 hover:bg-blue-700 text-white py-2 rounded-lg font-bold text-sm transition-colors">
                    분석 생성 / 수정 요청
                </button>
                <div class="mt-2 flex items-center gap-2">
                    <input type="password" id="apiKey" class="flex-1 border text-xs p-1 rounded"
                        placeholder="OpenAI API Key 입력 (일회성)">
                    <span class="text-[10px] text-gray-400">키는 저장되지 않습니다.</span>
                </div>
            </div>
        </aside>

        <main class="flex-1 bg-gray-50 flex flex-col overflow-hidden relative">
            <div class="p-4 border-b border-gray-200 bg-white flex justify-between items-center shrink-0">
                <h2 class="font-bold text-gray-800 flex items-center gap-2">
                    <span class="material-symbols-outlined text-blue-600">preview</span>
                    실시간 미리보기
                </h2>
                <span id="statusText" class="text-xs font-bold text-gray-400">대기중...</span>
            </div>

            <div class="flex-1 overflow-auto p-6" id="previewArea">
                <div class="h-full flex flex-col items-center justify-center text-gray-400">
                    <p>왼쪽 채팅창에 명령을 입력하면<br>여기에 분석 결과가 나타납니다.</p>
                </div>
            </div>

            <div id="loadingOverlay"
                class="hidden absolute inset-0 bg-white/80 backdrop-blur-sm flex items-center justify-center z-50">
                <div class="flex flex-col items-center animate-pulse">
                    <div class="w-12 h-12 border-4 border-blue-200 border-t-blue-600 rounded-full animate-spin mb-4">
                    </div>
                    <span class="font-bold text-blue-600">AI가 코드를 작성중입니다...</span>
                </div>
            </div>
        </main>
    </div>

    <script>
        // 전역 변수
        let messageHistory = [];
        let currentConfig = null;
        let allDraws = []; // 로또 데이터 캐싱

        // 1. 데이터 로드 (페이지 진입 시)
        document.addEventListener('DOMContentLoaded', async () => {
            const client = window.supabaseClient || window.supabase;
            if (!client) {
                alert('DB 연결 실패: common_v2.js 확인 필요');
                return;
            }
            // 전체 회차 데이터 로드
            const { data } = await client.from('lotto_draws').select('*').order('round', { ascending: false });
            allDraws = data;
            console.log(`데이터 로드 완료: ${allDraws.length}회차`);
        });

        // 2. 메시지 전송 및 AI 호출
        async function sendPrompt() {
            const input = document.getElementById('userPrompt');
            const apiKey = document.getElementById('apiKey').value;
            const text = input.value.trim();

            if (!text) return;
            if (!apiKey) { alert('OpenAI API Key를 입력해주세요.'); return; }

            // UI 업데이트
            addChatBubble(text, 'user');
            input.value = '';
            document.getElementById('loadingOverlay').classList.remove('hidden');

            // 메시지 히스토리 관리
            messageHistory.push({ role: "user", content: text });

            try {
                // 시스템 프롬프트 (핵심)
                const systemPrompt = `
                    당신은 로또 분석 시스템의 'Code Generator'입니다. 
                    사용자의 요청을 해석하여 화면에 표(Table)를 그릴 데이터 가공 로직(JS)을 JSON으로 반환하세요.

                    [데이터 구조]
                    변수명: allDraws (내림차순 정렬됨, 인덱스 0이 최신)
                    구조: [{ round: 1000, numbers: [1,2,3,4,5,6], date: '...' }, ...]

                    [반환 포맷 (JSON Only)]
                    {
                        "title": "분석 제목 (짧게)",
                        "description": "설명",
                        "headers": ["회차", "컬럼1", "컬럼2", ...],
                        "tableLogic": "allDraws를 map/filter하여 { col1: val, ... } 배열을 리턴하는 JS 코드 본문 (문자열)",
                        "filterLogic": "(numbers, prevDraw) => 매칭개수(int) 를 리턴하는 JS 함수 본문",
                        "filterConfig": { "label": "필터질문", "min": 0, "max": 6 }
                    }

                    [주의사항]
                    1. tableLogic은 반드시 return [...] 형태여야 함.
                    2. 코드는 간결하고 효율적으로 작성.
                    3. 마크다운 형식이 아닌 순수 JSON 문자열만 응답하세요.
                `;
                // ... (생략된 경우 필요 시 추가 로직 작성)
            } catch (err) {
                console.error(err);
            }
        }

        // 채팅 말풍선 추가
        function addChatBubble(text, role) {
            const container = document.getElementById('chatHistory');
            const bubble = document.createElement('div');
            bubble.className = `chat-bubble chat-${role}`;
            bubble.innerHTML = text.replace(/\n/g, '<br>');
            container.appendChild(bubble);
            container.scrollTop = container.scrollHeight;
        }

        async function saveAnalysis() {
            // 저장 로직 (필요시 구현)
            alert('저장 기능은 준비 중입니다.');
        }
    </script>
</body>

</html>
