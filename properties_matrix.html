        // 매트릭스 렌더링
        // ==========================================
        async function renderMatrix(targetRound) {
            const indicator = document.getElementById('loadingOverlay');
            if (indicator) indicator.classList.remove('hidden');

            try {
                // 1. DB에서 데이터 가져오기 (비동기)
                // 만약 미래 회차(예정)라면, 통계 및 회귀 데이터는 직전 회차(가장 최신)의 것을 가져옵니다.
                const isFutureCandidate = allDraws.length > 0 && targetRound === allDraws[0].round + 1;
                const dataFetchRound = isFutureCandidate ? allDraws[0].round : targetRound;

                const [stats, regressions] = await Promise.all([
                    fetchNumberStats(dataFetchRound),
                    fetchRegressionDetails(dataFetchRound)
                ]);

                // 2. 전역 변수 업데이트
                numberStats = stats;

                const targetIdx = allDraws.findIndex(d => d.round === targetRound);
                let isFuture = false;
                if (targetIdx === -1) {
                    if (allDraws.length > 0 && targetRound === allDraws[0].round + 1) {
                        isFuture = true;
                    } else {
                        alert('해당 회차를 찾을 수 없습니다.');
                        indicator.classList.add('hidden');
                        return;
                    }
                }

                let winningNumbers = [];
                let prevNumbers = [];
                let analysisBaseIndex = 0;

                if (isFuture) {
                    currentDraw = { round: targetRound, numbers: [], bonus: null, date: '추첨 예정' };
                    prevDraw = allDraws[0];
                    winningNumbers = [];
                    prevNumbers = prevDraw.numbers;
                    analysisBaseIndex = 0;
                } else {
                    currentDraw = allDraws[targetIdx];
                    prevDraw = allDraws[targetIdx + 1] || { numbers: [] };
                    winningNumbers = currentDraw.numbers;
                    prevNumbers = prevDraw.numbers || [];
                    analysisBaseIndex = targetIdx + 1;
                }

                // numberStats는 이미 위에서 fetchNumberStats로 가져옴

                // Toggle View (AI vs Summary)
                const aiSection = document.querySelector('.ai-chat-section');
                const summarySection = document.getElementById('summaryCard');

                if (isFuture) {
                    if (aiSection) aiSection.classList.remove('hidden');
                    if (summarySection) summarySection.classList.add('hidden');
                } else {
                    if (aiSection) aiSection.classList.add('hidden');
                    if (summarySection) summarySection.classList.remove('hidden');
                    setTimeout(() => renderSummaryCard(false), 0);
                }

                const thead = document.getElementById('tableHeader');
                const tbody = document.getElementById('tableBody');
                thead.innerHTML = '';
                tbody.innerHTML = '';

                // 헤더
                const headerTr = document.createElement('tr');
                headerTr.innerHTML = '<th>속성 / 번호</th>';

                for (let i = 1; i <= 45; i++) {
                    const isWinner = winningNumbers.includes(i);
                    const numClass = getNumClass(i);
                    const dividerClass = (i % 5 === 0 && i < 45) ? 'col-divider-5' : '';
                    const winnerClass = isWinner ? 'col-winner-header' : numClass;

                    headerTr.innerHTML += `<th class="${winnerClass} ${dividerClass}"
            id="header-col-${i}"
            onclick="toggleColumnHighlight(${i})"
            onmouseenter="showTooltip(event, ${i})"
            onmouseleave="hideTooltip()">${i}</th>`;
                }
                thead.appendChild(headerTr);

                // A. 고정 속성
                addSectionHeader(tbody, '고정 속성', 'fixed', 'category');

                const addFixedRow = (label, fn) => addRow(tbody, label, fn, 'dot-fixed', winningNumbers, 'fixed');

                // 1. 홀짝
                addFixedRow('홀수', n => n % 2 !== 0);
                addFixedRow('짝수', n => n % 2 === 0);

                // 2. 고저
                addFixedRow('저 (1~22)', n => n <= 22);
                addFixedRow('고 (23~45)', n => n >= 23);

                // 3. 수의 특성 (소수, 합성수, 삼각수, 제곱수, 동형수)
                addFixedRow('소수', n => FIXED.primes.has(n));
                addFixedRow('합성수', n => FIXED.composites.has(n));
                addFixedRow('삼각수', n => FIXED.triangulars.has(n));
                addFixedRow('제곱수', n => FIXED.squares.has(n));
                addFixedRow('동형수', n => FIXED.twins.has(n));

                // 4. 배수 (3, 4, 5)
                addFixedRow('3배수', n => FIXED.multi3.has(n));
                addFixedRow('4배수', n => FIXED.multi4.has(n));
                addFixedRow('5배수', n => FIXED.multi5.has(n));

                // 5. 번호대 (단번대 ~ 40번대)
                addFixedRow('단번대', n => n <= 10);
                addFixedRow('10번대', n => n > 10 && n <= 20);
                addFixedRow('20번대', n => n > 20 && n <= 30);
                addFixedRow('30번대', n => n > 30 && n <= 40);
                addFixedRow('40번대', n => n > 40);

                // 6. 끝수
                for (let i = 0; i <= 9; i++) addFixedRow(`${i} 끝`, n => (n % 10) === i);

                // 7. 9궁 (Magic Square)
                MAGIC_9.forEach((nums, idx) => addFixedRow(`${idx + 1} 궁`, n => nums.includes(n)));

                // 8. 로또용지 (가로/세로)
                for (let r = 1; r <= 7; r++) {
                    const start = (r - 1) * 7 + 1;
                    const end = Math.min(r * 7, 45);
                    addFixedRow(`가로${r} `, n => n >= start && n <= end);
                }
                for (let c = 1; c <= 7; c++) {
                    // 세로c: c, c+7, c+14...
                    addFixedRow(`세로${c} `, n => (n - c) >= 0 && (n - c) % 7 === 0);
                }

                // B. 가변 속성
                addSectionHeader(tbody, `가변 속성(${targetRound}회 기준)`, 'var', 'tune');

                const addVarRow = (label, fn, dotClass = 'dot-var') => addRow(tbody, label, fn, dotClass, winningNumbers, 'var');

                const neighbors = new Set();
                prevNumbers.forEach(n => {
                    if (n > 1) neighbors.add(n - 1);
                    if (n < 45) neighbors.add(n + 1);
                });
                addVarRow('이웃수', n => neighbors.has(n) && !prevNumbers.includes(n));
                addVarRow('이월수', n => prevNumbers.includes(n));

                const thresholds = { 5: { hot: 2 }, 10: { hot: 3 }, 15: { hot: 4 }, 20: { hot: 5 } };
                const ranges = [5, 10, 15, 20];

                // Hot Group
                ranges.forEach(range => {
                    const endIdx = Math.min(analysisBaseIndex + range, allDraws.length);
                    const subset = allDraws.slice(analysisBaseIndex, endIdx);
                    const freqs = Array(46).fill(0);
                    subset.forEach(d => d.numbers.forEach(num => freqs[num]++));
                    const th = thresholds[range];
                    addVarRow(`핫(${range})`, n => freqs[n] >= th.hot, 'dot-hot');
                });

                // Neutral Group
                ranges.forEach(range => {
                    const endIdx = Math.min(analysisBaseIndex + range, allDraws.length);
                    const subset = allDraws.slice(analysisBaseIndex, endIdx);
                    const freqs = Array(46).fill(0);
                    subset.forEach(d => d.numbers.forEach(num => freqs[num]++));
                    const th = thresholds[range];
                    addVarRow(`중립(${range})`, n => freqs[n] > 0 && freqs[n] < th.hot, 'dot-warm');
                });

                // Cold Group
                ranges.forEach(range => {
                    const endIdx = Math.min(analysisBaseIndex + range, allDraws.length);
                    const subset = allDraws.slice(analysisBaseIndex, endIdx);
                    const freqs = Array(46).fill(0);
                    subset.forEach(d => d.numbers.forEach(num => freqs[num]++));
                    addVarRow(`콜드(${range})`, n => freqs[n] === 0, 'dot-cold');
                });

                // 미출현 Gap
                const gapRow = document.createElement('tr');
                gapRow.className = `group-var ${sectionState.var ? '' : 'collapsed'}`;
                gapRow.innerHTML = '<th>미출현(Gap)</th>';
                for (let n = 1; n <= 45; n++) {
                    const isWinner = winningNumbers.includes(n);
                    const bgClass = isWinner ? 'col-winner' : '';
                    const dividerClass = (n % 5 === 0 && n < 45) ? 'col-divider-5' : '';
                    const gap = numberStats[n]?.gap || 0;
                    const textColor = gap >= 10 ? 'color:var(--accent-rose);font-weight:600' : 'color:var(--text-muted)';
                    gapRow.innerHTML += `<td class="${bgClass} ${dividerClass}" style="font-size:13px;${textColor};font-family:'JetBrains Mono',monospace">${gap}</td>`;
                }
                tbody.appendChild(gapRow);

                // C. 회귀 분석
                addSectionHeader(tbody, '회귀 속성 (2~200회귀)', 'reg', 'history');

                const regSummaryRow = document.createElement('tr');
                regSummaryRow.className = `group-reg ${sectionState.reg ? '' : 'collapsed'}`;
                regSummaryRow.innerHTML = '<th style="color:var(--accent-emerald)">회귀일치 횟수</th>';

                for (let n = 1; n <= 45; n++) {
                    const isWinner = winningNumbers.includes(n);
                    const bgClass = isWinner ? 'col-winner' : '';
                    const dividerClass = (n % 5 === 0 && n < 45) ? 'col-divider-5' : '';

                    // [수정] DB의 regCount 대신 현재 렌더링된 regressions 목록에서 직접 계산 (동적 일관성 확보)
                    const regCount = regressions.filter(reg => {
                        const dist = reg.regression_distance;
                        const pastRound = targetRound - dist;
                        const sourceNums = (isFutureCandidate)
                            ? (allDraws.find(d => d.round === pastRound)?.numbers)
                            : (reg.source_numbers || allDraws.find(d => d.round === pastRound)?.numbers);
                        return sourceNums && sourceNums.includes(n);
                    }).length;

                    const textColor = regCount >= 5 ? 'color:var(--accent-emerald);font-weight:600' : 'color:var(--text-muted)';
                    regSummaryRow.innerHTML += `<td class="${bgClass} ${dividerClass}" style="font-size:13px;${textColor};font-family:'JetBrains Mono',monospace">${regCount}</td>`;
                }
                tbody.appendChild(regSummaryRow);

                // 회귀 상세 데이터 출력 (가져온 regressions 배열 활용)
                console.log(`Rendering ${regressions.length} regressions for round ${targetRound}`);

                // 2회귀부터 거리순으로 정렬하여 표시
                const sortedRegressions = regressions
                    .filter(r => r.regression_distance >= 2)
                    .sort((a, b) => a.regression_distance - b.regression_distance);

                sortedRegressions.forEach(reg => {
                    const dist = reg.regression_distance;
                    const pastRound = targetRound - dist;
                    // [Fix] 미래 회차(isFutureCandidate)인 경우, DB의 source_numbers(이전 회차 기준)를 쓰지 않고
                    // 현재 타겟(targetRound) 기준으로 재계산된 pastRound의 번호를 사용해야 함.
                    const sourceNums = (isFutureCandidate)
                        ? (allDraws.find(d => d.round === pastRound)?.numbers)
                        : (reg.source_numbers || allDraws.find(d => d.round === pastRound)?.numbers);

                    const tr = document.createElement('tr');
                    tr.id = `reg-row-${dist}`;
                    tr.className = `group-reg ${sectionState.reg ? '' : 'collapsed'}`;

                    const th = document.createElement('th');
                    const isActive = filterState.reg;
                    const indicatorColor = isActive ? '#10b981' : '#475569';
                    const indicator = `<span class="filter-indicator" data-group="reg" style="width:7px;height:7px;background:${indicatorColor};border-radius:50%;display:inline-block;margin-right:10px;vertical-align:middle;transition:background 0.2s;"></span>`;
                    th.innerHTML = `${indicator}${dist}회귀(${pastRound})`;
                    th.style.cursor = 'pointer';

                    // [추가] 클릭 시 회귀 분석 페이지로 이동 (파라미터 포함)
                    th.onclick = () => {
                        window.location.href = `regression.html?step=${dist}`;
                    };

                    th.onmouseenter = (e) => {
                        showRegressionTooltip(e, dist, targetRound);
                        if (sourceNums) highlightNumbersProperty(sourceNums);
                        // 회귀 행의 마름모꼴 점들을 노란색으로 하이라이트
                        highlightRegressionDots(dist, true);
                    };
                    th.onmouseleave = (e) => {
                        hideTooltip();
                        stopHighlight();
                        clearPropertyHighlights();
                        // 노란색 하이라이트 제거 (클릭된 것 제외)
                        highlightRegressionDots(dist, false);
                    };
                    th.onmousedown = () => highlightRegressionRow(dist);
                    th.onmouseup = stopHighlight;
                    tr.appendChild(th);

                    for (let n = 1; n <= 45; n++) {
                        const td = document.createElement('td');
                        if (winningNumbers.includes(n)) td.classList.add('col-winner');
                        if (n % 5 === 0 && n < 45) td.classList.add('col-divider-5');

                        if (sourceNums && sourceNums.includes(n)) {
                            const dot = document.createElement('span');
                            dot.className = 'dot dot-reg';
                            dot.setAttribute('data-regression', dist);
                            dot.setAttribute('data-number', n);
                            // 클릭 시 노란색 하이라이트 토글
                            dot.onclick = (e) => {
                                e.stopPropagation();
                                dot.classList.toggle('dot-reg-click-highlight');
                            };
                            td.appendChild(dot);
                        }
                        tr.appendChild(td);
                    }
                    tbody.appendChild(tr);
                });

                applyFilters();
                setChunking(true);

            } catch (e) {
                console.error(e);
                alert('분석 오류: ' + e.message);
            } finally {
                if (indicator) indicator.classList.add('hidden');
            }
        }

        // [추가] 속성별 페이지 매핑 데이터
        const PAGE_MAP = {
            "홀수": "odd_even.html", "짝수": "odd_even.html",
            "저 (1~22)": "low_high.html", "고 (23~45)": "low_high.html",
            "소수": "prime_number.html", "합성수": "composite_number.html",
            "삼각수": "triangular_number.html", "제곱수": "square_number.html",
            "동형수": "twin_number.html", "3배수": "multiple.html",
            "단번대": "number_range.html", "10번대": "number_range.html",
            "20번대": "number_range.html", "30번대": "number_range.html",
            "40번대": "number_range.html",
            "이웃수": "neighbor_number.html", "이월수": "carryover.html",
            "핫": "hot_cold.html", "콜드": "hot_cold.html",
            "미출현(Gap)": "missing.html"
        };

        function getNumClass(n) {
            if (n <= 10) return 'num-1-10';
            if (n <= 20) return 'num-11-20';
            if (n <= 30) return 'num-21-30';
            if (n <= 40) return 'num-31-40';
            return 'num-41-45';
        }

        // ==========================================
        // 헬퍼 함수
        // ==========================================
        function addSectionHeader(tbody, text, groupId, iconName) {
            const tr = document.createElement('tr');
            const icon = iconName ? `<span class="material-symbols-outlined" style="font-size:16px;margin-right:8px;vertical-align:middle">${iconName}</span>` : '';
            const chevron = sectionState[groupId] ? 'expand_less' : 'expand_more';

            tr.innerHTML = `
                <th class="section-header section-${groupId}" colspan="46">
                    <div style="display:flex;align-items:center;justify-content:space-between">
                        <div>${icon}${text}</div>
                        <span class="material-symbols-outlined" style="font-size:18px;color:var(--text-muted)" id="icon-${groupId}">${chevron}</span>
                    </div>
                </th >
                `;
            tr.onclick = () => toggleGroup(groupId);
            tbody.appendChild(tr);
        }

        function addRow(tbody, label, checkFn, dotClass, winningNumbers, groupId) {
            const tr = document.createElement('tr');
            tr.className = `group-${groupId} ${sectionState[groupId] ? '' : 'collapsed'}`;

            const th = document.createElement('th');
            th.classList.add('prop-label-th');

            // 필터 상태 표시등
            const INDICATOR_ACTIVE = { fixed: '#3b82f6', var: '#f59e0b', reg: '#10b981' };
            const isActive = filterState[groupId];
            const indicatorColor = isActive ? (INDICATOR_ACTIVE[groupId] || '#3b82f6') : '#475569';
            const indicator = `<span class="filter-indicator" data-group="${groupId}" style="width:7px;height:7px;background:${indicatorColor};border-radius:50%;display:inline-block;margin-right:10px;vertical-align:middle;transition:background 0.2s;"></span>`;

            th.innerHTML = `${indicator}${label}`;
            th.style.cursor = 'pointer';

            // [추가] 클릭 시 해당 분석 페이지로 이동
            th.onclick = () => {
                const cleanLabel = label.split('(')[0].trim();
                const page = PAGE_MAP[cleanLabel] || (label.includes('끝') ? 'tail_digit.html' : (label.includes('궁') ? 'magic_square.html' : null));
                if (page) window.location.href = page;
                else console.log(`No page mapped for: ${cleanLabel}`);
            };

            // 속성 호버 이벤트
            th.onmouseenter = () => {
                const nums = [];
                for (let i = 1; i <= 45; i++) {
                    if (checkFn(i)) nums.push(i);
                }
                highlightNumbersProperty(nums);
            };
            th.onmouseleave = clearPropertyHighlights;

            tr.appendChild(th);

            for (let n = 1; n <= 45; n++) {
                const td = document.createElement('td');
                if (winningNumbers.includes(n)) td.classList.add('col-winner');
                if (n % 5 === 0 && n < 45) td.classList.add('col-divider-5');

                if (checkFn(n)) {
                    const dot = document.createElement('span');
                    dot.className = `dot ${dotClass} `;
                    dot.setAttribute('data-number', n);
                    dot.onmouseenter = (e) => showTooltip(e, n);
                    dot.onmouseleave = hideTooltip;
                    td.appendChild(dot);
                }
                tr.appendChild(td);
            }
            tbody.appendChild(tr);
        }

        function toggleGroup(groupId) {
            sectionState[groupId] = !sectionState[groupId];
            const rows = document.querySelectorAll(`.group-${groupId}`);
            const icon = document.getElementById(`icon-${groupId}`);

            rows.forEach(row => {
                if (sectionState[groupId]) row.classList.remove('collapsed');
                else row.classList.add('collapsed');
            });

            if (icon) {
                icon.textContent = sectionState[groupId] ? 'expand_less' : 'expand_more';
            }
        }

        function toggleColumnHighlight(col) {
            const cells = document.querySelectorAll(`.matrix-table td:nth-child(${col + 1}), .matrix-table th:nth-child(${col + 1})`);

            if (activeCol === col) {
                cells.forEach(c => c.classList.remove('col-highlight'));
                activeCol = null;
            } else {
                if (activeCol !== null) {
                    document.querySelectorAll('.col-highlight').forEach(c => c.classList.remove('col-highlight'));
                }
                cells.forEach(c => {
                    if (!c.classList.contains('col-winner') && !c.classList.contains('col-winner-header')) {
                        c.classList.add('col-highlight');
                    }
                });
                activeCol = col;
            }
        }

        // ==========================================
        // 필터 기능
        // ==========================================
        function toggleFilter(type) {
            filterState[type] = !filterState[type];
            applyFilters();
        }

        function toggleWinnerOnly() {
            filterState.winnerOnly = !filterState.winnerOnly;
            const btn = document.querySelector('[data-filter="winner-only"]');
            if (btn) btn.classList.toggle('active', filterState.winnerOnly);
            applyFilters();
        }

        function applyFilters() {
            const INDICATOR_ACTIVE = { fixed: '#60a5fa', var: '#fbbf24', reg: '#34d399' };
            const INDICATOR_INACTIVE = '#475569';
            ['fixed', 'var', 'reg'].forEach(type => {
                const isActive = filterState[type];
                const indicatorColor = isActive ? INDICATOR_ACTIVE[type] : INDICATOR_INACTIVE;
                // 행 dimmed 처리
                document.querySelectorAll(`.group-${type}`).forEach(row => {
                    row.classList.toggle('dimmed', !isActive);
                });
                // 인디케이터 점 색상 일괄 업데이트
                document.querySelectorAll(`.filter-indicator[data-group="${type}"]`).forEach(el => {
                    el.style.background = indicatorColor;
                });
                // 필터 버튼 active 상태 동기화
                const btn = document.querySelector(`[data-filter="${type}"]`);
                if (btn) btn.classList.toggle('active', isActive);
            });

            if (filterState.winnerOnly && currentDraw) {
                for (let i = 1; i <= 45; i++) {
                    const opacity = currentDraw.numbers.includes(i) ? '1' : '0.1';
                    document.querySelectorAll(`.matrix-table td:nth-child(${i + 1})`).forEach(c => c.style.opacity = opacity);
                }
            } else {
                document.querySelectorAll('.matrix-table td').forEach(c => c.style.opacity = '1');
            }
        }

        // ==========================================
        // 툴팁
        // ==========================================
        function showTooltip(e, num) {
            const tooltip = document.getElementById('tooltip');
            const stats = numberStats[num];
            if (!stats) return;

            document.getElementById('tooltipTitle').textContent = `번호 ${num} `;

            let content = `
            <div class="tooltip-row">
                    <span class="tooltip-label">속성</span>
                    <span class="tooltip-value">${stats.properties.slice(0, 3).join(', ')}</span>
                </div>
                <div class="tooltip-row">
                    <span class="tooltip-label">미출현</span>
                    <span class="tooltip-value">${stats.gap}회</span>
                </div>
                <div class="tooltip-row">
                    <span class="tooltip-label">최근10회 출현</span>
                    <span class="tooltip-value ${stats.hotCold}">${stats.freq10}회 (${stats.hotCold === 'hot' ? '핫🔥' : stats.hotCold === 'cold' ? '콜드❄️' : '보통'})</span>
                </div>
                <div class="tooltip-row">
                    <span class="tooltip-label">회귀 일치</span>
                    <span class="tooltip-value">${stats.regCount}회</span>
                </div>
        `;

            if (currentDraw && currentDraw.numbers.includes(num)) {
                content += `
            <div class="tooltip-row" style="background:rgba(52,211,153,0.1);margin-top:8px;padding:6px;border-radius:6px;border:none">
                <span class="tooltip-value winner">🎯 이번 회차 당첨번호!</span>
                    </div>
            `;
            }

            document.getElementById('tooltipContent').innerHTML = content;

            document.getElementById('tooltipContent').innerHTML = content;

            // Fix Position for Right Side
            const tooltipWidth = 260; // Approximate max width or measure it
            let leftPos = e.clientX + 15;
            let topPos = e.clientY + 15;

            if (leftPos + tooltipWidth > window.innerWidth) {
                leftPos = e.clientX - tooltipWidth - 15;
            }

            tooltip.style.left = leftPos + 'px';
            tooltip.style.top = topPos + 'px';
            tooltip.classList.add('visible');
        }

        function hideTooltip() {
            const tooltip = document.getElementById('tooltip');
            if (tooltip) {
                tooltip.classList.remove('visible');
                tooltip.style.opacity = ''; // 인라인 투명도 초기화
            }
        }

        // ==========================================
        // 보기 설정 & 미니맵
        // ==========================================
        function setViewDensity(mode) {
            const table = document.getElementById('matrixTable');
            const btns = document.querySelectorAll('[id^="btn-density-"]');
            btns.forEach(b => b.classList.remove('active'));

            const btn = document.getElementById(`btn-density-${mode}`);
            if (btn) btn.classList.add('active');

            if (table) table.classList.toggle('mode-compact', mode === 'compact');
            if (isMinimapVisible) updateMinimap();
        }

        function setMarkerStyle(style) {
            const table = document.getElementById('matrixTable');
            const btns = document.querySelectorAll('[id^="btn-style-"]');
            btns.forEach(b => b.classList.remove('active'));

            const btn = document.getElementById(`btn-style-${style}`);
            if (btn) btn.classList.add('active');

            if (style === 'full') {
                if (table) table.classList.add('style-full');
                document.querySelectorAll('.dot').forEach(dot => {
                    const td = dot.parentElement;
                    td.classList.add('has-data');
                    if (dot.classList.contains('dot-fixed')) td.classList.add('type-fixed');
                    if (dot.classList.contains('dot-var')) td.classList.add('type-var');
                    if (dot.classList.contains('dot-reg')) td.classList.add('type-reg');
                    if (dot.classList.contains('dot-hot')) td.classList.add('type-hot');
                    if (dot.classList.contains('dot-cold')) td.classList.add('type-cold');
                });
            } else {
                if (table) table.classList.remove('style-full');
            }
        }

        function setChunking(enable) {
            const btns = document.querySelectorAll('[id^="btn-chunk-"]');
            btns.forEach(b => b.classList.remove('active'));

            const btn = document.getElementById(enable ? 'btn-chunk-on' : 'btn-chunk-off');
            if (btn) btn.classList.add('active');

            document.querySelectorAll('.col-chunk-bg').forEach(c => c.classList.remove('col-chunk-bg'));

            if (enable) {
                for (let i = 11; i <= 20; i++) addChunkBg(i);
                for (let i = 31; i <= 40; i++) addChunkBg(i);
            }
        }

        function addChunkBg(colIdx) {
            document.querySelectorAll(`.matrix-table tr > :nth-child(${colIdx + 1})`).forEach(c => {
                if (!c.classList.contains('col-winner') && !c.classList.contains('col-highlight')) {
                    c.classList.add('col-chunk-bg');
                }
            });
        }

        // 미니맵
        let isMinimapVisible = false;

        function toggleMinimap() {
            const container = document.getElementById('minimapContainer');
            const btn = document.getElementById('btn-minimap');

            isMinimapVisible = !isMinimapVisible;

            if (isMinimapVisible) {
                container.classList.add('visible');
                btn.classList.add('active');
                requestAnimationFrame(updateMinimap);
                document.getElementById('contentArea').addEventListener('scroll', updateMinimapViewport);
                window.addEventListener('resize', updateMinimap);
            } else {
                container.classList.remove('visible');
                btn.classList.remove('active');
                document.getElementById('contentArea').removeEventListener('scroll', updateMinimapViewport);
                window.removeEventListener('resize', updateMinimap);
            }
        }

        function updateMinimap() {
            if (!isMinimapVisible) return;

            const table = document.getElementById('matrixTable');
            const contentArea = document.getElementById('contentArea');
            const canvas = document.getElementById('minimapCanvas');
            const ctx = canvas.getContext('2d');

            const tableRect = table.getBoundingClientRect();
            const ratio = 84 / tableRect.width;

            canvas.width = 84;
            canvas.height = Math.min(tableRect.height * ratio, 200);
            canvas.style.height = canvas.height + 'px';

            ctx.fillStyle = '#1a1a24';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            document.querySelectorAll('.dot').forEach(dot => {
                const td = dot.closest('td');
                const tr = dot.closest('tr');
                if (!td || !tr) return;

                const colIdx = td.cellIndex;
                const rowIdx = tr.rowIndex;

                const x = (colIdx / 46) * canvas.width;
                const y = (rowIdx / table.rows.length) * canvas.height;

                ctx.fillStyle = getComputedStyle(dot).backgroundColor;
                ctx.fillRect(x, y, 2, 2);
            });

            updateMinimapViewport();

            canvas.onclick = (e) => {
                const clickY = e.offsetY;
                const targetScrollY = (clickY / canvas.height) * table.scrollHeight;
                contentArea.scrollTo({ top: targetScrollY - contentArea.clientHeight / 2, behavior: 'smooth' });
            };
        }

        function updateMinimapViewport() {
            const contentArea = document.getElementById('contentArea');
            const table = document.getElementById('matrixTable');
            const viewport = document.getElementById('minimapViewport');
            const canvas = document.getElementById('minimapCanvas');

            const scrollRatio = contentArea.scrollTop / table.scrollHeight;
            const viewRatio = contentArea.clientHeight / table.scrollHeight;

            viewport.style.top = (8 + scrollRatio * canvas.height) + 'px';
            viewport.style.height = Math.max(viewRatio * canvas.height, 10) + 'px';
        }
        // ==========================================
        // [복원] AI 프롬프트 라이브러리 & 분석 함수
        // ==========================================
        function toggleDrawer(show) {
            const overlay = document.getElementById('drawerOverlay');
            const drawer = document.getElementById('promptDrawer');
            if (show) {
                renderLibrary(); // 열 때 렌더링
                overlay.classList.add('active');
                drawer.classList.add('active');
            } else {
                overlay.classList.remove('active');
                drawer.classList.remove('active');
            }
        }

        function setPrompt(text) {
            const input = document.getElementById('aiUserPrompt');
            input.value = text;
            input.focus();
            toggleDrawer(false); // 드로어 닫기
        }

        function renderLibrary(filterText = '') {
            const container = document.getElementById('drawerBody');
            container.innerHTML = '';

            const term = filterText.toLowerCase();

            Object.entries(PROMPT_DATA).forEach(([key, section]) => {
                const sectionDiv = document.createElement('div');
                sectionDiv.className = 'category-group';

                const labelDiv = document.createElement('div');
                labelDiv.className = 'category-label';
                labelDiv.innerHTML = `<span class="material-symbols-outlined" style="font-size:14px">${section.icon}</span> ${section.label}`;
                sectionDiv.appendChild(labelDiv);

                let hasVisibleItems = false;

                section.groups.forEach(group => {
                    // 검색 필터 적용
                    const filteredPrompts = group.prompts.filter(p =>
                        p.label.toLowerCase().includes(term) ||
                        p.text.toLowerCase().includes(term)
                    );

                    if (filteredPrompts.length > 0) {
                        hasVisibleItems = true;
                        const subGroupDiv = document.createElement('div');
                        subGroupDiv.className = 'sub-group';

                        const subTitle = document.createElement('div');
                        subTitle.className = 'sub-group-title';
                        subTitle.textContent = group.title;
                        subGroupDiv.appendChild(subTitle);

                        const listDiv = document.createElement('div');
                        listDiv.className = 'prompt-list';

                        filteredPrompts.forEach(p => {
                            const btn = document.createElement('button');
                            btn.className = 'prompt-item';
                            btn.innerHTML = `<strong>${p.label}</strong><br><span style="color:#64748b;font-size:12px">${p.text}</span>`;
                            btn.onclick = () => setPrompt(p.text);
                            listDiv.appendChild(btn);
                        });

                        subGroupDiv.appendChild(listDiv);
                        sectionDiv.appendChild(subGroupDiv);
                    }
                });

                if (hasVisibleItems) {
                    container.appendChild(sectionDiv);
                }
            });

            if (container.children.length === 0) {
                container.innerHTML = `<div style="text-align:center;padding:40px;color:#94a3b8">검색 결과가 없습니다.</div>`;
            }
        }

        // [공통] 화면 데이터 수집 헬퍼 함수 - AI에게 '눈'을 제공
        function collectPageContext() {
            let contextData = "## [속성 매트릭스 현황 - Visual Context]\n";

            // 1. 요약 카드(Summary Stats) 수집
            const summaryBadge = document.querySelector('.summary-title-badge');
            if (summaryBadge) contextData += `[분석 타겟]: ${summaryBadge.innerText.trim()}\n\n`;

            const statItems = document.querySelectorAll('#summaryStats .stat-item');
            if (statItems.length > 0) {
                contextData += "### 주요 통계 지표 (Summary Stats):\n";
                // 화면에 보이는 순서대로 수집
                statItems.forEach(item => {
                    const label = item.querySelector('.stat-label')?.innerText.trim() || '';
                    const val = item.querySelector('.stat-value')?.innerText.trim() || '';
                    if (label && val) {
                        contextData += `- ${label}: ${val.replace(/\s+/g, ' ')}\n`;
                    }
                });
            } else {
                contextData += "(요약 통계 데이터 로딩되지 않음)\n";
            }

            // 2. 최근 5회차 당첨 흐름 (JS 변수 allDraws 활용 - 가장 정확함)
            if (typeof allDraws !== 'undefined' && allDraws.length > 0) {
                contextData += "\n### [최근 5회차 당첨 번호 흐름]\n";
                allDraws.slice(0, 5).forEach(d => {
                    contextData += `- ${d.round}회: ${d.numbers.join(', ')} (보너스: ${d.bonus})\n`;
                });
            }

            // 3. 매트릭스 테이블 데이터 수집 (화면에 표시된 속성 정보)
            const tableRows = document.querySelectorAll('#tableBody tr');
            if (tableRows.length > 0) {
                contextData += "\n### [속성 테이블 하이라이트 정보]\n";
                let collectedCount = 0;
                tableRows.forEach((row, index) => {
                    // 헤더나 구분선 제외하고 의미있는 데이터만
                    const labelCell = row.querySelector('td.property-label, td:first-child');
                    if (labelCell) {
                        const label = labelCell.innerText.trim();
                        // 번호 셀들 중 활성화(색칠)된 것만 찾을 수도 있지만, 텍스트 전체를 가져오되 길이를 제한
                        const fullText = row.innerText.replace(/\s+/g, ' ').trim();

                        // 주요 속성(가변, 회귀 등) 위주로 상단 20개만
                        if (collectedCount < 30 && (index < 10 || label.includes('회귀') || label.includes('Gap') || label.includes('빈도'))) {
                            contextData += `- ${fullText.substring(0, 100)}${fullText.length > 100 ? '...' : ''}\n`;
                            collectedCount++;
                        }
                    }
                });
            }
            return contextData;
        }

        // 🔥 [New] AI 분석 요청 함수 (복원 및 NLP 통합 - Refactored)
        async function submitCustomAIAnalysis() {
            const inputEl = document.getElementById('aiUserPrompt');
            const userPrompt = inputEl.value.trim();
            if (!userPrompt) { alert("질문을 입력해주세요."); return; }

            if (window.nlpProcessor) {
                const result = window.nlpProcessor.process(userPrompt);
                if (result.intent !== 'unknown' && result.confidence > 0.6) {
                    if (result.intent === 'navigate' && result.params.targetRound) {
                        const select = document.getElementById('roundSelect');
                        if (select) { select.value = result.params.targetRound; loadDataForRound(); return; }
                    }
                }
            }

            // executeLocalAIAnalysis 사용 (데이터 주입)
            const currentRound = document.getElementById('roundSelect').value;
            const contextStr = collectPageContext();

            await executeLocalAIAnalysis({
                containerId: 'aiResponse',
                subjectRound: parseInt(currentRound),
                targetRound: parseInt(currentRound) + 1,
                userPrompt: userPrompt,
                contextData: contextStr,
                responseStyle: 'chat'
            });
        }

        function setQuickPrompt(type) {
            const input = document.getElementById('aiUserPrompt');
            const prompts = {
                'regression': '가장 유력한 회귀 패턴과 당첨 가능성이 높은 번호는?',
                'gap': '미출현 기간이 한계점에 도달한 번호들을 분석해줘.',
                'hot_cold': '최근 핫/콜드 번호의 교차 흐름을 분석해서 예측해줘.',
                'fixed_var': '현재 고정 속성과 가변 속성의 균형이 어떻게 깨지고 있는지 분석해줘.',
                'prime_comp': '소수와 합성수의 출현 비율을 토대로 다음 회차를 예측해줘.',
                'even_odd': '최근 홀짝 비율의 편중 현상을 분석해줘.',
                'low_high': '최근 22를 기준으로 한 저고 분포의 흐름을 알려줘.',
                'tail': '가장 강력한 끝수 패턴과 제외해야 할 끝수는?',
                'sum': '최근 총합의 평균 회귀 지점을 고려한 예상 범위를 알려줘.',
                'ac': 'AC값의 변화를 통해 조합의 복잡도를 분석해줘.',
                'serial': '연속 번호가 나올 가능성이 높은 구간은 어디야?',
                'carryover': '지난 회차 번호 중 다시 나올 확률이 높은 이월수는?',
                'neighbor': '당첨 번호 주변의 이웃수 중 유력한 후보는?',
                'magic': '마방진(9궁) 내에서 에너지가 쏠리고 있는 구간을 분석해줘.',
                'combi': '지금까지의 속성을 종합해서 최적의 번호 조합을 제안해줘.'
            };
            if (prompts[type]) {
                input.value = prompts[type];
                // [수정] 화면 스크롤 방지 - 현재 스크롤 위치 유지
                const contentArea = document.getElementById('contentArea');
                const scrollPos = contentArea ? contentArea.scrollTop : 0;
                submitCustomAIAnalysis().then(() => {
                    if (contentArea) contentArea.scrollTop = scrollPos;
                });
            }
        }

        async function submitQnaAnalysis() {
            const input = document.getElementById('aiQnaInput');
            const promptStr = input.value.trim();
            if (!promptStr) return;

            // [수정] 헬퍼 함수 사용하여 데이터 수집
            const contextData = collectPageContext();

            openQnaModal();
            const qnaContent = document.getElementById('aiQnaContent');
            qnaContent.innerHTML += `<div class="flex justify-end"><div class="bg-blue-600 text-white px-4 py-2 rounded-xl">${promptStr}</div></div>`;
            input.value = '';

            const currentRound = document.getElementById('roundSelect').value;
            const container = document.createElement('div');
            container.id = 'qna-' + Date.now();
            qnaContent.appendChild(container);

            await executeLocalAIAnalysis({
                containerId: container.id,
                subjectRound: parseInt(currentRound),
                targetRound: parseInt(currentRound) + 1,
                userPrompt: promptStr,
                contextData: contextData // [핵심] 스크래핑한 데이터 주입
            });
        }
        function openQnaModal() {
            const m = document.getElementById('aiQnaModal');
            m.classList.remove('hidden');
            setTimeout(() => m.classList.remove('translate-x-full'), 10);
        }
        function closeQnaModal() {
            const m = document.getElementById('aiQnaModal');
            m.classList.add('translate-x-full');
            setTimeout(() => m.classList.add('hidden'), 300);
        }
        function setQnaInput(t) {
            const i = document.getElementById('aiQnaInput');
            i.value = t; i.focus();
        }
    </script>
