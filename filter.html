<!DOCTYPE html>
<html class="light" lang="ko">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Lotto Lab - 조합 필터</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="css/common.css" />
    <link as="style" crossorigin=""
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet" />

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/common_v2.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/filter/FilterService.js"></script>

    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }

        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f5f9;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }

        .animate-fadeIn {
            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 🔵 고정수: 글로우 효과 (Neon Blue Glow) */
        .ball-fixed {
            box-shadow: 0 0 12px rgba(59, 130, 246, 0.8), inset 0 0 5px rgba(255, 255, 255, 0.5);
            border: 2px solid #3b82f6 !important;
            animation: pulse-blue 2s infinite;
        }

        @keyframes pulse-blue {
            0% {
                box-shadow: 0 0 8px rgba(59, 130, 246, 0.6);
            }

            50% {
                box-shadow: 0 0 15px rgba(59, 130, 246, 1);
            }

            100% {
                box-shadow: 0 0 8px rgba(59, 130, 246, 0.6);
            }
        }

        /* ❌ 제외수: 빨간색 대각선 (Red Slash Overlay) */
        .ball-excluded {
            position: relative;
            filter: grayscale(0.2);
            opacity: 0.9;
            /* 텍스트(숫자) 뒤에 사선이 그려지도록 배경 이미지 사용 */
            background-image: linear-gradient(to bottom right, transparent calc(50% - 2px), #ef4444 calc(50% - 1.5px), #ef4444 calc(50% + 1.5px), transparent calc(50% + 2px)) !important;
            border: 1px solid #ef4444 !important;
        }

        /* 📌 Sticky Tab Header */
        .sticky-sub-header {
            position: sticky;
            top: 175px;
            /* GNB(64) + Header(60) + Basket(50) + approx padding */
            z-index: 40;
            background: #ffffff;
            border-bottom: 1px solid rgba(226, 232, 240, 0.8);
        }

        /* 탭 활성화 스타일 */
        .tab-btn.active {
            color: #4f46e5;
            border-bottom: 3px solid #4f46e5;
            background: #eef2ff;
        }
        @keyframes fadeInRow {
            from { opacity: 0; transform: translateY(-4px); }
            to   { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>

<body class="bg-[#F8FAFC] antialiased">
    <div id="gnb-container"></div>

    <div class="min-h-screen pb-24 font-sans text-slate-800">
        <!-- 🔝 Header (Sticky) -->
        <div class="sticky top-16 z-[90] bg-white border-b border-slate-200 shadow-sm overflow-hidden">
            <!-- Counter Row (Title Removed) -->
            <div class="max-w-7xl mx-auto px-6 py-3 flex items-center justify-between">
                <div class="flex items-center gap-5">
                    <div class="text-left">
                        <span
                            class="text-[10px] font-black text-indigo-500 uppercase tracking-widest block mb-0.5">Expected
                            Combinations</span>
                        <div class="text-4xl font-black font-mono text-slate-900 leading-none tracking-tighter"
                            id="neonCounter">
                            8,145,060
                        </div>
                    </div>
                </div>
                <div class="flex items-center gap-2">
                    <button onclick="window.location.reload()"
                        class="p-2 rounded-lg text-slate-400 hover:text-slate-600 hover:bg-slate-100 transition-colors" title="새로고침">
                        <span class="material-symbols-outlined" style="font-size:18px;">refresh</span>
                    </button>
                    <button id="btnStepCount"
                        onclick="window.stepCountCombinations()"
                        class="flex items-center gap-1.5 px-3.5 py-2 rounded-xl text-[13px] font-semibold text-violet-600 bg-violet-50 hover:bg-violet-100 border border-violet-200 transition-all active:scale-95"
                        title="필터별 단계 카운팅">
                        <span class="material-symbols-outlined" style="font-size:16px;">filter_list</span>
                        단계별 분석
                    </button>
                    <button id="btnDiagnose"
                        onclick="window.diagnoseCombinations()"
                        class="flex items-center gap-1.5 px-3.5 py-2 rounded-xl text-[13px] font-semibold text-rose-500 bg-rose-50 hover:bg-rose-100 border border-rose-200 transition-all active:scale-95"
                        title="어느 필터에서 탈락하는지 진단">
                        <span class="material-symbols-outlined" style="font-size:16px;">bug_report</span>
                        필터 진단
                    </button>
                    <button id="btnGenerateCombos"
                        onclick="window.generateFinalCombinations()"
                        class="flex items-center gap-1.5 px-4 py-2 rounded-xl text-[13px] font-semibold text-white bg-indigo-600 hover:bg-indigo-500 transition-all active:scale-95">
                        <span class="material-symbols-outlined" style="font-size:16px;">rocket_launch</span>
                        조합 생성
                    </button>
                </div>
            </div>

            <!-- Basket display -->
            <div class="bg-slate-50 border-t border-slate-100 py-2.5">
                <div class="max-w-7xl mx-auto px-6 flex gap-4">
                    <div
                        class="flex-1 bg-white rounded-xl border border-slate-200 p-2.5 shadow-sm flex items-center gap-4">
                        <span
                            class="text-[10px] font-black text-indigo-600 bg-indigo-50 px-2.5 py-1 rounded whitespace-nowrap uppercase tracking-wider">고정수</span>
                        <div id="topFixedBalls" class="flex flex-wrap gap-1.5 min-h-[32px] items-center"></div>
                    </div>
                    <div
                        class="flex-1 bg-white rounded-xl border border-slate-200 p-2.5 shadow-sm flex items-center gap-4">
                        <span
                            class="text-[10px] font-black text-rose-600 bg-rose-50 px-2.5 py-1 rounded whitespace-nowrap uppercase tracking-wider">제외수</span>
                        <div id="topExcludeBalls" class="flex flex-wrap gap-1.5 min-h-[32px] items-center"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 📑 Tabs Navigation (Sticky sub-section) -->
        <div class="sticky-sub-header border-b border-slate-200 shadow-sm mb-8">
            <div class="max-w-7xl mx-auto px-6 py-3 flex justify-center">
                <div class="flex bg-slate-100 p-1.5 rounded-2xl w-full max-w-2xl shadow-inner">
                    <button onclick="FilterDashboard.switchTab('foundation')" data-tab="foundation"
                        class="tab-btn flex-1 py-2.5 text-sm font-black rounded-xl transition-all active">기초분석</button>
                    <button onclick="FilterDashboard.switchTab('regression')" data-tab="regression"
                        class="tab-btn flex-1 py-2.5 text-sm font-black rounded-xl transition-all">회귀분석</button>
                    <button onclick="FilterDashboard.switchTab('custom')" data-tab="custom"
                        class="tab-btn flex-1 py-2.5 text-sm font-black rounded-xl transition-all">커스텀분석</button>
                </div>
            </div>
        </div>

        <div class="max-w-7xl mx-auto px-6 py-4 space-y-10">

            <!-- 📁 Foundation Analysis Tab Content -->
            <div id="tab-foundation" class="tab-content">
                <div class="flex items-center gap-2 mb-4">
                    <h2 class="text-xl font-bold text-slate-900">기초 및 속성 분석 필터</h2>
                    <span id="foundationActiveCount"
                        class="px-2 py-0.5 rounded-md bg-indigo-100 text-indigo-700 text-xs font-bold">0개 켜짐</span>
                </div>
                <!-- 1-column layout as requested -->
                <div id="foundationFilterGrid" class="grid grid-cols-1 gap-5">
                </div>
            </div>

            <!-- 🔄 Regression Analysis Tab Content -->
            <div id="tab-regression" class="tab-content hidden">
                <div class="flex items-center justify-between mb-4">
                    <div class="flex items-center gap-2">
                        <h2 class="text-xl font-bold text-slate-900">회귀 분석 (2~200회귀)</h2>
                        <span id="regressionActiveCount"
                            class="px-2 py-0.5 rounded-md bg-emerald-100 text-emerald-700 text-xs font-bold">0개
                            켜짐</span>
                    </div>
                    <div class="flex gap-2">
                        <button id="btnRegAllOn"
                            class="px-4 py-1.5 text-xs font-bold text-slate-600 bg-white border border-slate-300 rounded-lg hover:bg-slate-50">전체
                            ON</button>
                        <button id="btnRegAllOff"
                            class="px-4 py-1.5 text-xs font-bold text-slate-600 bg-white border border-slate-300 rounded-lg hover:bg-slate-50">전체
                            OFF</button>
                    </div>
                </div>
                <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
                    <!-- Removed separate internal scrollbar as it's now in a tab -->
                    <div id="regressionFilterGrid" class="divide-y divide-slate-100">
                    </div>
                </div>
            </div>

            <!-- 🤖 AI Custom Tab Content -->
            <div id="tab-custom" class="tab-content hidden">
                <div class="flex items-center gap-2 mb-4">
                    <h2 class="text-xl font-bold text-slate-900">AI 커스텀 동적 필터</h2>
                    <span id="customActiveCount"
                        class="px-2 py-0.5 rounded-md bg-pink-100 text-pink-700 text-xs font-bold">0개 켜짐</span>
                </div>
                <!-- 1-column layout as requested -->
                <div id="customFilterGrid" class="grid grid-cols-1 gap-5">
                </div>
            </div>

        </div>
    </div>


    <script src="js/filter/FilterStatsData.js"></script>
    <script src="js/filter_dashboard.js?v=5"></script>
    <script src="js/filter_counter_patch.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (window.FilterDashboard) window.FilterDashboard.init();

            // URL 해시 기반 자동 스크롤 (예: filter.html#filter-total_sum)
            if (window.location.hash) {
                setTimeout(() => {
                    const target = document.querySelector(window.location.hash);
                    if (target) {
                        target.scrollIntoView({ behavior: 'smooth', block: 'center' });
                        target.style.outline = '2px solid #6366f1';
                        target.style.boxShadow = '0 0 0 4px rgba(99,102,241,0.2)';
                        setTimeout(() => { target.style.outline = ''; target.style.boxShadow = ''; }, 2000);
                    }
                }, 1200);
            }
        });
    </script>
</body>

</html>
