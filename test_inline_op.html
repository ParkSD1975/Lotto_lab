<!DOCTYPE html>
<html lang="ko">
<head>
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta charset="utf-8">
    <title>Inline Op Test</title>
</head>
<body>
    <h1>Stage 6-5-1: 워크스페이스 inline 연산 테스트</h1>
    <pre id="output"></pre>

    <script src="js/simulator_evaluator.js"></script>
    <script>
        const log = (msg) => {
            document.getElementById('output').textContent += msg + '\n';
        };

        // 테스트 회차 데이터 (한국 로또 1222회 예시)
        const draws = [
            { drawNo: 1222, round: 1222, numbers: [1, 5, 12, 23, 34, 41], bonus: 34, maxBall: 45 },
            { drawNo: 1221, round: 1221, numbers: [2, 8, 15, 20, 33, 45], bonus: 10, maxBall: 45 },
        ];

        log('=== 테스트 1: chip + op + chip (번호 + 보너스) ===');
        const steps1 = {
            workspaces: [
                {
                    cards: [
                        { type: 'line', numbers: [1, 5, 12, 23, 34, 41], offset: 0, drawNo: 1222 },
                        { type: 'op', value: '+' },
                        { type: 'bonus', bonus: 34, offset: 0, drawNo: 1222 },
                    ],
                    transforms: [],
                    mode: 'auto',
                }
            ],
            combineOps: [],
            version: 'v5-multi',
        };
        const result1 = window.evalSimulatorFormulaForDraw(steps1, draws, 1222, 45);
        log('입력: [1,5,12,23,34,41] + 34');
        log('출력: ' + JSON.stringify(result1));
        log('예상: [35(1+34), 39(5+34), 46→1(12+34 mod45), ...]');
        log('');

        log('=== 테스트 2: chip + op + chip (번호 ÷ 상수) ===');
        const steps2 = {
            workspaces: [
                {
                    cards: [
                        { type: 'line', numbers: [12, 24, 36], offset: 0, drawNo: 1222 },
                        { type: 'op', value: '/' },
                        { type: 'num', num: 10 },
                    ],
                    transforms: [],
                    mode: 'auto',
                }
            ],
            combineOps: [],
            version: 'v5-multi',
        };
        const result2 = window.evalSimulatorFormulaForDraw(steps2, draws, 1222, 45);
        log('입력: [12, 24, 36] ÷ 10 (나머지)');
        log('출력: ' + JSON.stringify(result2));
        log('예상: [2, 4, 6]');
        log('');

        log('=== 테스트 3: chip + chip (op 없이 union — backward compat) ===');
        const steps3 = {
            workspaces: [
                {
                    cards: [
                        { type: 'line', numbers: [1, 5], offset: 0, drawNo: 1222 },
                        { type: 'bonus', bonus: 34, offset: 0, drawNo: 1222 },
                    ],
                    transforms: [],
                    mode: 'auto',
                }
            ],
            combineOps: [],
            version: 'v5-multi',
        };
        const result3 = window.evalSimulatorFormulaForDraw(steps3, draws, 1222, 45);
        log('입력: [1,5] (chip1) + [34] (chip2, op 없음)');
        log('출력: ' + JSON.stringify(result3));
        log('예상: [1, 5, 34] (union)');
        log('');

        log('=== 테스트 4: 마지막 op 토큰 무시 ===');
        const steps4 = {
            workspaces: [
                {
                    cards: [
                        { type: 'line', numbers: [1, 5], offset: 0, drawNo: 1222 },
                        { type: 'op', value: '+' },
                    ],
                    transforms: [],
                    mode: 'auto',
                }
            ],
            combineOps: [],
            version: 'v5-multi',
        };
        const result4 = window.evalSimulatorFormulaForDraw(steps4, draws, 1222, 45);
        log('입력: [1,5] + (op만 있고 다음 chip 없음)');
        log('출력: ' + JSON.stringify(result4));
        log('예상: [1, 5] (마지막 op 무시)');
        log('');

        log('=== 모든 테스트 완료 ===');
    </script>
</body>
</html>
