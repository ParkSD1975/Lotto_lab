name: Fix HF Space Variable Collision and Re-run Pipeline

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Install deps
        run: pip install requests huggingface_hub

      - name: Resolve collision, restart space, trigger pipeline
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'EOF'
          import os, time, requests
          from huggingface_hub import HfApi

          SPACE = "Parksungdeok/lotto-ai-backend"
          token = os.environ["HF_TOKEN"]
          headers = {"Authorization": f"Bearer {token}"}
          api = HfApi(token=token)

          # 1. 변수 목록 조회
          r = requests.get(f"https://huggingface.co/api/spaces/{SPACE}/variables", headers=headers)
          print(f"[GET variables] {r.status_code}: {r.text[:500]}")
          var_names = []
          if r.status_code == 200:
              try:
                  data = r.json()
                  # API 응답이 dict({name: {...}}) 또는 list([{key/name: ...}, ...]) 둘 다 가능
                  if isinstance(data, dict):
                      var_names = list(data.keys())
                  elif isinstance(data, list):
                      for v in data:
                          if isinstance(v, dict):
                              vn = v.get("key") or v.get("name")
                              if vn:
                                  var_names.append(vn)
              except Exception as e:
                  print(f"[parse variables] {e}")
          print(f"[variable names] {var_names}")

          # 2. 시크릿과 충돌하는 변수 모두 삭제 (시크릿이 진짜 값 보유)
          conflict_names = {"GOOGLE_API_KEY", "SUPABASE_URL", "SUPABASE_KEY", "HF_TOKEN"}
          for vname in var_names:
              if vname in conflict_names:
                  d = requests.delete(
                      f"https://huggingface.co/api/spaces/{SPACE}/variables",
                      headers=headers,
                      json={"key": vname},
                  )
                  print(f"[DEL variable {vname}] {d.status_code}: {d.text[:200]}")

          # 3. Space 재시작
          time.sleep(5)
          try:
              api.restart_space(repo_id=SPACE)
              print("✅ restart_space called")
          except Exception as e:
              print(f"⚠️ restart 실패: {e}")

          # 4. Space가 RUNNING 될 때까지 대기 (최대 8분)
          for i in range(48):
              time.sleep(10)
              try:
                  meta = requests.get(f"https://huggingface.co/api/spaces/{SPACE}", timeout=10).json()
                  stage = meta.get("runtime", {}).get("stage", "?")
                  err   = meta.get("runtime", {}).get("errorMessage", "")
                  print(f"[wait {i*10}s] stage={stage} err={err[:120]}")
                  if stage == "RUNNING":
                      print("✅ Space RUNNING")
                      break
                  if stage in ("CONFIG_ERROR", "BUILD_ERROR", "RUNTIME_ERROR"):
                      print(f"❌ Space error: {stage} / {err}")
                      break
              except Exception as e:
                  print(f"⚠️ status check error: {e}")

          # 5. 헬스체크
          for i in range(20):
              try:
                  r = requests.get(f"https://parksungdeok-lotto-ai-backend.hf.space/", timeout=10)
                  print(f"[health {i}] {r.status_code}: {r.text[:120]}")
                  if r.status_code == 200:
                      break
              except Exception as e:
                  print(f"[health {i}] err: {e}")
              time.sleep(8)

          # 6. 파이프라인 트리거
          try:
              r = requests.post(
                  "https://parksungdeok-lotto-ai-backend.hf.space/api/pipeline/run-v2",
                  timeout=30,
              )
              print(f"[pipeline run-v2] {r.status_code}: {r.text[:300]}")
          except Exception as e:
              print(f"[pipeline run-v2] failed: {e}")

          print("DONE")
          EOF
