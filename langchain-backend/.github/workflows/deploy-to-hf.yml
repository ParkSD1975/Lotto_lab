name: Deploy to Hugging Face Spaces

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install huggingface_hub
        run: pip install huggingface_hub

      - name: Push to Hugging Face Spaces
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python - <<'EOF'
          import os
          from huggingface_hub import HfApi

          api = HfApi(token=os.environ["HF_TOKEN"])

          # 1. 코드 배포
          # LFS pointer 파일 7개는 deploy 제외 — HF Space에 이미 가중치 보존됨
          api.upload_folder(
              folder_path=".",
              repo_id="Parksungdeok/lotto-ai-backend",
              repo_type="space",
              ignore_patterns=[
                  ".git*", "__pycache__", "*.pyc",
                  ".github", ".env", ".env.*",
                  "*.log", "backend*.log", "server*.log",
                  "train_log.txt",
                  "saved_models/meta_learner.pkl",
                  "saved_models/cnn_model.pt",
                  "saved_models/xgboost_models.pkl",
                  "saved_models/autoencoder_model.pt",
                  "saved_models/transformer_model.pt",
                  "saved_models/gnn_model.pt",
                  "saved_models/lstm_model.pt",
              ]
          )
          # saved_models/ 일부 제외 — HF 기존 가중치 유지
          print("✅ HF Spaces 코드 배포 완료!")

          # .env 파일 HF Space 레포에서 삭제 (이전에 업로드된 경우)
          try:
              api.delete_file(
                  path_in_repo=".env",
                  repo_id="Parksungdeok/lotto-ai-backend",
                  repo_type="space",
                  commit_message="remove .env from space repo"
              )
              print("✅ HF Space에서 .env 삭제 완료!")
          except Exception as e:
              print(f"ℹ️ .env 삭제 생략 (파일 없거나 이미 삭제됨): {e}")

          # 2. 시크릿 동기화 (HF REST API)
          import requests
          hf_token = os.environ.get("HF_TOKEN", "")
          headers  = {"Authorization": f"Bearer {hf_token}"}
          SPACE    = "parksungdeok/lotto-ai-backend"

          def sync_secret(key, value):
              if not value:
                  print(f"ℹ️ {key} 미설정 → HF Space 기존 키 유지")
                  return
              r = requests.put(
                  f"https://huggingface.co/api/spaces/{SPACE}/secrets",
                  headers=headers,
                  json={"key": key, "value": value},
              )
              if r.status_code in (200, 201):
                  print(f"✅ {key} 동기화 완료! ({r.status_code})")
              else:
                  print(f"⚠️ {key} REST API 실패 ({r.status_code}): {r.text[:200]}")
                  try:
                      api.add_space_secret(repo_id=SPACE, key=key, value=value)
                      print(f"✅ {key} SDK fallback 동기화 완료!")
                  except Exception as e2:
                      print(f"⚠️ {key} SDK fallback도 실패: {e2}")

          sync_secret("GOOGLE_API_KEY", os.environ.get("GOOGLE_API_KEY", ""))
          sync_secret("SUPABASE_URL",   os.environ.get("SUPABASE_URL", ""))
          sync_secret("SUPABASE_KEY",   os.environ.get("SUPABASE_KEY", ""))

          # 3. Space 강제 재빌드 (factory_reboot=True - 새 requirements.txt 적용)
          import time
          time.sleep(30)   # 시크릿 전파 대기
          try:
              api.restart_space(
                  repo_id="Parksungdeok/lotto-ai-backend",
                  factory_reboot=True,  # Docker 재빌드 강제 (catboost/tabnet/tft 라이브러리 설치)
              )
              print("✅ HF Space factory_reboot 완료 (Docker 재빌드 진행)!")
              time.sleep(10)  # 재시작 시작 대기
          except Exception as e:
              print(f"⚠️ 재시작 실패 (무시): {e}")
          EOF
