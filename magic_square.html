    <script>
        // 전역 변수 설정
        let allDrawData = [];
        let currentRange = 100;
        let chartTab = 'rate'; // 'rate' or 'trend'
        let trendChartInstance = null;

        // 초기 상태: 선택된 궁 없음 (종합 분석 모드)
        let selectedGraphType = null;

        // 셀 하이라이트 상태 관리 (컬럼명, 값)
        let selectedHighlight = { col: null, val: null };
        let highlightStartRound = null;
        let isRecentTenFilter = false; // [추가] '최근 10회차' 모드 상태값

        // 9궁 정의 (5개씩 끊음)
        const gungDefinitions = {
            '1궁': [1, 2, 3, 4, 5],
            '2궁': [6, 7, 8, 9, 10],
            '3궁': [11, 12, 13, 14, 15],
            '4궁': [16, 17, 18, 19, 20],
            '5궁': [21, 22, 23, 24, 25],
            '6궁': [26, 27, 28, 29, 30],
            '7궁': [31, 32, 33, 34, 35],
            '8궁': [36, 37, 38, 39, 40],
            '9궁': [41, 42, 43, 44, 45]
        };

        // 9궁 색상 정의 (무지개톤 + 파스텔)
        const gungColors = {
            '1궁': '#EF4444', // Red
            '2궁': '#F97316', // Orange
            '3궁': '#F59E0B', // Amber
            '4궁': '#84CC16', // Lime
            '5궁': '#10B981', // Emerald
            '6궁': '#06B6D4', // Cyan
            '7궁': '#3B82F6', // Blue
            '8궁': '#8B5CF6', // Violet
            '9궁': '#EC4899'  // Pink
        };

        // 필터 상태
        let filterState = {};
        let _gungSelfSaving = false; // 자체 저장 StorageEvent 루프 방지

        // [추가] 최근 10회차 필터를 비활성화하고 UI를 초기화하는 함수
        function deactivateRecent10IfActive() {
            if (isRecentTenFilter) {
                isRecentTenFilter = false;
                highlightStartRound = null;

                const btn = document.getElementById('recent10FilterBtn');
                const btnText = document.getElementById('recent10BtnText');
                if (btn) {
                    btn.classList.remove('from-purple-500', 'to-purple-700', 'shadow-purple-200');
                    btn.classList.add('from-blue-500', 'to-blue-600', 'shadow-blue-200');
                }
                if (btnText) btnText.textContent = '최근 10회차 필터 적용';

                localStorage.setItem('magic_square_filter_isManual', 'true');
                saveFilterSettings();
            }
        }

        // [추가] 수동 조작 마킹
        function markManual() {
            localStorage.setItem('magic_square_filter_isManual', 'true');
            deactivateRecent10IfActive();
        }

        // [수정] 필터 설정 저장 함수 (DB 저장 및 Local 방송)
        async function saveFilterSettings() {
            const filters = {};
            Object.keys(gungDefinitions).forEach(type => {
                const minInput = document.getElementById(`min_${type}`);
                const maxInput = document.getElementById(`max_${type}`);
                if (minInput && maxInput) {
                    filters[type] = {
                        min: parseInt(minInput.value),
                        max: parseInt(maxInput.value)
                    };
                }
            });

            // [Fix] 대시보드와 동일한 targetRound 규칙: round+1 (차기 회차)
            const currentRound = (allDrawData && allDrawData.length > 0) ? allDrawData[0].round : null;
            const dbTargetRound = currentRound ? currentRound + 1 : null;

            // settings 내 targetRound는 현재 회차 (새 회차 감지용)
            const data = { filters: filters, targetRound: currentRound, recent10FilterActive: isRecentTenFilter };
            const enabled = document.getElementById('applyFilterCheck').checked;

            // IS NULL 행 저장 + localStorage 방송 (self-saving 루프 방지)
            if (window.Utils && window.Utils.saveFilter) {
                try {
                    _gungSelfSaving = true;
                    await window.Utils.saveFilter('magic_square_pattern', data, enabled);
                } finally {
                    _gungSelfSaving = false;
                }
            } else if (window.filterService && window.filterService.initialized) {
                await window.filterService.saveSetting('magic_square_pattern', data, enabled);
            }
            // [Fix] DB target_round = round+1 → 대시보드 loadAllSettings(round+1)과 일치
            if (dbTargetRound && window.filterService?.initialized) {
                try {
                    await window.filterService.saveSetting('magic_square_pattern', data, enabled, dbTargetRound);
                } catch (e) { /* 무시 */ }
            }
        }

        // [수정] 필터 설정 불러오기 함수 (DB 로드 및 외부 데이터 수용)
        async function loadFilterSettings(externalData = null) {
            let saved = externalData;
            const currentRound = (allDrawData && allDrawData.length > 0) ? allDrawData[0].round : null;

            if (!saved) {
                // DB에서 로드 (FilterService 사용)
                if (window.filterService && window.filterService.initialized) {
                    // [Fix] 대시보드와 동일한 round+1로 조회 → 동기화 일치
                    const dbTargetRound = currentRound ? currentRound + 1 : null;
                    const data = await window.filterService.loadSetting('magic_square_pattern', dbTargetRound);
                    if (data) {
                        saved = data;
                    }
                }

                if (!saved) {
                    const localData = localStorage.getItem('magic_square_pattern');
                    if (localData) {
                        try {
                            saved = JSON.parse(localData);
                        } catch (e) { }
                    }
                }
            }

            // [Unboxing] 다양한 구조 대응 (envelope vs flat)
            let settings = null;
            let enabled = true;

            if (saved) {
                if (saved.settings) {
                    // envelope 구조: { settings: { filters, targetRound }, enabled }
                    settings = saved.settings;
                    enabled = (saved.enabled !== undefined) ? saved.enabled : true;
                } else if (saved.filters) {
                    // 준-envelope 구조: { filters, targetRound, enabled }
                    settings = saved;
                    enabled = (saved.enabled !== undefined) ? saved.enabled : true;
                } else {
                    // 구 구조 (flat)
                    settings = { filters: saved };
                    enabled = true;
                }
            }

            if (settings) {
                // [New] 새 회차(토요일 업데이트) 인지 확인하여 다르면 기본값(최근 10회차) 적용 위해 false 반환
                const currentRound = (allDrawData && allDrawData.length > 0) ? allDrawData[0].round : null;
                if (settings.targetRound && currentRound && parseInt(settings.targetRound) !== parseInt(currentRound)) {
                    console.log('🔄 새 회차 감지됨, 최근 10회차 기본값으로 초기화 및 자동 저장합니다.');
                    // [추가] 새 회차 시 초기화된 값을 즉시 DB에 저장하여 전체 동기화 유지
                    setTimeout(() => saveFilterSettings(), 500);
                    return false;
                }

                if (settings.filters) {
                    Object.keys(settings.filters).forEach(type => {
                        const minInput = document.getElementById(`min_${type}`);
                        const maxInput = document.getElementById(`max_${type}`);
                        if (minInput && maxInput && settings.filters[type]) {
                            minInput.value = settings.filters[type].min;
                            maxInput.value = settings.filters[type].max;
                        }
                    });
                }

                document.getElementById('applyFilterCheck').checked = enabled;
                // [수정] isRecentTenFilter 상태 동기화
                isRecentTenFilter = !!settings.recent10FilterActive;
                const btn = document.getElementById('recent10FilterBtn');
                const btnText = document.getElementById('recent10BtnText');
                if (btn && btnText) {
                    if (isRecentTenFilter) {
                        btn.classList.remove('from-blue-500', 'to-blue-600', 'shadow-blue-200');
                        btn.classList.add('from-purple-500', 'to-purple-700', 'shadow-purple-200');
                        btnText.textContent = '필터 해제';
                        highlightStartRound = allDrawData?.[0]?.round || null;
                    } else {
                        btn.classList.remove('from-purple-500', 'to-purple-700', 'shadow-purple-200');
                        btn.classList.add('from-blue-500', 'to-blue-600', 'shadow-blue-200');
                        btnText.textContent = '최근 10회차 필터 적용';
                        highlightStartRound = null;
                    }
                }
                return true;
            }
            return false;
        }
    </script>

                                    class="flex items-center gap-2 px-6 py-2.5 bg-gradient-to-r from-blue-500 to-blue-600 text-white rounded-xl shadow-lg shadow-blue-200 hover:shadow-xl hover:-translate-y-0.5 transition-all text-sm font-black mb-[1px] min-w-[240px] justify-center whitespace-nowrap">
                                    <span class="material-symbols-outlined text-[18px]">auto_fix_high</span>
                                    <span id="recent10BtnText">최근 10회차 필터 적용</span>
                                </button>
                            </div>
                        </div>
                    </div>

                    <div class="mt-8">
                        <div class="flex items-center justify-between mb-4 px-2">
                            <div>
                                <h3 class="text-xl font-bold text-gray-900 mb-1">회차별 9궁 출현 현황</h3>
                                <p class="text-sm text-gray-600">
                                    최근 <span id="displayedCount" class="font-bold text-blue-600">100</span>회차 표시 (검은색
                                    숫자는 미출현 기간)
                                </p>
                            </div>
                        </div>

                        <div class="overflow-x-auto overflow-y-auto custom-scrollbar bg-white rounded-xl border border-gray-200 shadow-sm"
                            style="max-height: 600px;">
                            <table class="w-full text-sm text-left">
                                <thead id="drawsListHeader"
                                    class="sticky top-0 bg-[#1e293b] text-white font-semibold z-30 shadow-sm border-b border-[#334155] text-sm">
                                </thead>
                                <tbody id="drawsList" class="divide-y divide-gray-100"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script>

        document.addEventListener('DOMContentLoaded', async function () {
            try {
                // Supabase 로드
                const { data, error } = await supabaseClient
                    .from('lotto_draws')
                    .select('*')
                    .order('round', { ascending: false })
                    .range(0, 5000);

                // FilterService 초기화 (DB 필터 저장용)
                if (window.initFilterService) {
                    await window.initFilterService();
                }

                if (error) throw error;

                if (!data || data.length === 0) {
                    document.getElementById('drawsList').innerHTML = '<tr><td colspan="11" class="p-10 text-center">데이터가 없습니다.</td></tr>';
                    return;
                }

                processData(data);

                const totalCount = allDrawData.length;
                const rangeSlider = document.getElementById('rangeSlider');
                rangeSlider.max = totalCount;
                document.getElementById('totalRangeDisplay').textContent = `최대 ${totalCount.toLocaleString()}회`;
                document.getElementById('preset1203').setAttribute('onclick', `setRange(${totalCount})`);

                initStatCards();
                initFilters();

                // [필터 로드 로직] 저장된 값이 없으면 최근 10회차 기준 기본값 사용
                if (!await loadFilterSettings()) {
                    // initFilters에서 이미 기본값이 설정되었으므로 적용만 수행
                    const displayData = allDrawData?.[0] ? allDrawData.slice(0, currentRange) : [];
                    renderDrawsList(displayData);
                    updateCharts(displayData);
                    updateStats(displayData);
                }

                // 로그아웃 시 필터 UI 초기화
                function resetFilterUI() {
                    Object.keys(gungDefinitions).forEach(type => {
                        const minEl = document.getElementById(`min_${type}`);
                        const maxEl = document.getElementById(`max_${type}`);
                        if (minEl) minEl.value = 0;
                        if (maxEl) maxEl.value = 0;
                    });
                    highlightStartRound = null;
                    const chk = document.getElementById('applyFilterCheck');
                    if (chk) chk.checked = false;
                    const btn = document.getElementById('recent10FilterBtn');
                    const btnText = document.getElementById('recent10BtnText');
                    if (btn) {
                        btn.classList.remove('from-purple-500', 'to-purple-700');
                        btn.classList.add('from-blue-500', 'to-blue-600');
                    }
                    if (btnText) btnText.textContent = '최근 10회차 필터 적용';
                    const displayData = allDrawData ? allDrawData.slice(0, currentRange) : [];
                    renderDrawsList(displayData);
                }

                // ── FilterEngine Lifecycle Integration (Phase 3) ─────────────
                window.addEventListener('filterLifecycle', function _filterLifecycleHandler(e) {
                    var _detail = e.detail;
                    if (_detail.type === 'NEW_ROUND') {
                        if (typeof checkAndResetOnNewDraw === 'function') checkAndResetOnNewDraw();
                    } else if (_detail.type === 'LOGOUT' || _detail.type === 'RESTORED') {
                        if (typeof loadFilterSettings === 'function') loadFilterSettings();
                    }
                });

                // [추가] 실시간 동기화: 다른 탭(대시보드 등)에서 필터 변경 시 즉시 반영
                window.addEventListener('storage', async (e) => {
                    if (_gungSelfSaving) return; // 자체 저장 이벤트 무시
                    if (e.key === 'magic_square_pattern' || e.key === 'magic_square_filter') {
                        if (!e.newValue) return;
                        try {
                            const newData = JSON.parse(e.newValue);
                            const fc = newData.settings !== undefined ? newData.settings : newData;

                            // 로그아웃 감지
                            if (newData.enabled === false && !fc.groups && !fc.filters) {
                                resetFilterUI(); return;
                            }
                            console.log('🔄 [Sync] 마방진 필터 변경 감지:', newData);
                            const loaded = await loadFilterSettings(newData);
                            if (loaded) {
                                console.log('✅ [Sync] 필터 값이 UI에 적용되었습니다.');
                                // UI 갱신 (applyFilter와 유사하지만 saveFilterSettings는 호출 안 함)
                                const displayData = allDrawData.slice(0, currentRange);
                                renderDrawsList(displayData);
                                updateCharts(displayData);
                                updateStats(displayData);
                                initDeepInsight();
                            }
                        } catch (err) { console.error('🔄 [Sync] Error:', err); }
                    }
                });

                updateRange(currentRange);
                initDeepInsight(); // [추가] 초기 로드 시 AI 리포트 실행

            } catch (err) {
                console.error('데이터 로드 실패:', err);
                document.getElementById('drawsList').innerHTML = `<tr><td colspan="11" class="p-10 text-center text-red-500">데이터 로드 실패<br>${err.message}</td></tr>`;
            }
        });

        function calculateGungCounts(numbers) {
            const counts = {};
            Object.keys(gungDefinitions).forEach(key => {
                counts[key] = numbers.filter(n => gungDefinitions[key].includes(n)).length;
            });
            return counts;
        }

        function processData(rawData) {
            // 1. 기본 카운트 계산
            let temp = rawData.map(draw => {
                const counts = calculateGungCounts(draw.numbers);
                return { ...draw, counts };
            });

            // 2. 미출현(Gap) 계산을 위해 오름차순 정렬
            temp.sort((a, b) => a.round - b.round);

            let gaps = {};
            // 초기 갭은 0으로 시작
            Object.keys(gungDefinitions).forEach(k => gaps[k] = 0);

            temp.forEach(draw => {
                draw.gaps = {};
                Object.keys(gungDefinitions).forEach(k => {
                    if (draw.counts[k] > 0) {
                        gaps[k] = 0;
                        draw.gaps[k] = 0;
                    } else {
                        gaps[k]++;
                        draw.gaps[k] = gaps[k];
                    }
                });
            });

            // 3. 내림차순(최신순) 정렬
            allDrawData = temp.sort((a, b) => b.round - a.round);
        }

        function initFilters() {
            const container = document.getElementById('filterContainer');
            container.innerHTML = '';

            // [New Logic] 최근 10회차 통계 계산 (기본값용)
            let recentStats = {};
            if (allDrawData && allDrawData.length >= 10) {
                const recent10 = allDrawData.slice(0, 10);
                Object.keys(gungDefinitions).forEach(type => {
                    const values = recent10.map(d => d.counts[type]);
                    recentStats[type] = {
                        min: Math.min(...values),
                        max: Math.max(...values)
                    };
                });
            }

            Object.keys(gungDefinitions).forEach(type => {
                const numbersHtml = gungDefinitions[type].map(n =>
                    `<span class="lotto-ball-mini" style="background-color: ${gungColors[type]};">${n}</span>`
                ).join('');

                const div = document.createElement('div');
                div.className = 'border-b border-gray-100 pb-4 last:border-0';

                const defMin = recentStats[type] ? recentStats[type].min : 0;
                const defMax = recentStats[type] ? recentStats[type].max : 5;

                div.innerHTML = `
                    <div class="flex items-center justify-between gap-4">
                        <div class="flex-1">
                            <div class="flex items-center gap-2 mb-2">
                                <span class="font-bold text-gray-700 w-10">${type}</span>
                                <span class="text-xs text-gray-400">(${gungDefinitions[type].length}개)</span>
                            </div>
                            <div class="flex flex-wrap gap-1.5">
                                ${numbersHtml}
                            </div>
                        </div>
                        <div class="flex items-center gap-2">
                            <span class="text-sm text-gray-500 font-bold">Min</span>
                            <input type="number" id="min_${type}" oninput="applyFilterManual()" value="${defMin}" min="0" max="5"
                                class="w-16 h-9 text-center border border-gray-300 rounded-lg text-sm text-gray-900 font-bold focus:ring-blue-500 focus:border-blue-500">
                            <span class="text-gray-400">~</span>
                            <span class="text-sm text-gray-500 font-bold">Max</span>
                            <input type="number" id="max_${type}" oninput="applyFilterManual()" value="${defMax}" min="0" max="5"
                                class="w-16 h-9 text-center border border-gray-300 rounded-lg text-sm text-gray-900 font-bold focus:ring-blue-500 focus:border-blue-500">
                        </div>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        function initStatCards() {
            const container = document.getElementById('statCards');
            container.innerHTML = '';

            Object.keys(gungDefinitions).forEach(type => {
                const div = document.createElement('div');
                // [수정됨] 한 줄 배치, 높이 축소
                div.className = 'bg-white rounded-lg p-2 border border-gray-200 relative overflow-hidden group hover:shadow-md transition-all text-center cursor-pointer stat-card-transition flex items-center justify-between px-3';
                div.onclick = () => toggleStatCard(type);
                div.id = `card-${type}`;

                div.innerHTML = `
                    <span class="text-xs font-bold stat-label" style="color: ${gungColors[type]};">${type}</span>
                    <span id="stat_${type}" class="text-sm font-bold text-gray-900 stat-value">-</span>
                `;
                container.appendChild(div);
            });
        }

        function toggleStatCard(type) {
            markManual(); // [추가] 수동 조작 마킹
            if (selectedGraphType === type) {
                selectedGraphType = null;
            } else {
                selectedGraphType = type;
            }
            updateStatCardStyles();
            if (selectedGraphType) {
                document.getElementById('graphTypeSelect').value = selectedGraphType;
            }
            const displayData = allDrawData.slice(0, currentRange);
            renderDrawsList(displayData);
            updateCharts(displayData);
            initDeepInsight();
        }

        function updateStatCardStyles() {
            Object.keys(gungDefinitions).forEach(type => {
                const card = document.getElementById(`card-${type}`);
                if (!card) return;

                if (selectedGraphType === type) {
                    card.classList.add('stat-card-active');
                    card.style.backgroundColor = gungColors[type];
                    card.querySelector('.stat-value').classList.remove('text-gray-900');
                    card.querySelector('.stat-value').classList.add('text-white');
                    card.querySelector('.stat-label').style.color = 'white';
                } else {
                    card.classList.remove('stat-card-active');
                    card.style.backgroundColor = 'white';
                    card.querySelector('.stat-value').classList.remove('text-white');
                    card.querySelector('.stat-value').classList.add('text-gray-900');
                    card.querySelector('.stat-label').style.color = gungColors[type];
                }
            });
        }

        let rangeUpdateTimeout;

        function updateRange(value) {
            markManual(); // [수정] markManual 공통 함수 사용
            const val = parseInt(value);
            currentRange = val;

            // Immediate Feedback
            document.getElementById('rangeDisplay').textContent = val + '회';
            updateSliderBackground(val);
            updatePresetButtons(val);

            // Instant Update (No Debounce)
            const displayData = allDrawData.slice(0, currentRange);
            updateStats(displayData);
            renderDrawsList(displayData);
            updateCharts(displayData);
        }

        // [추가] 필터 초기화 함수 (Reset)
        // ... (필요 시 내용 추가)

        // [New] Overlay Helpers
        function showLoadingOverlay() {
            const overlay = document.getElementById('aiLoadingOverlay');
            if (overlay) overlay.classList.remove('hidden');
        }

        function hideLoadingOverlay() {
            const overlay = document.getElementById('aiLoadingOverlay');
            if (overlay) overlay.classList.add('hidden');
        }

        function updateStats(data) {
            const total = data.length;
            if (total === 0) return;

            Object.keys(gungDefinitions).forEach(type => {
                const sum = data.reduce((acc, curr) => acc + curr.counts[type], 0);
                const avg = (sum / total).toFixed(1);
                document.getElementById(`stat_${type}`).textContent = avg;
            });
        }

        // (toggleCellHighlight redundant definition removed from here)

        function renderDrawsList(draws) {
            const thead = document.getElementById('drawsListHeader');
            const cols = Object.keys(gungDefinitions).map(type => {
                const isActive = (selectedGraphType === type);
                const activeClass = isActive ? 'th-active' : 'bg-[#1e293b] text-white border-b border-[#334155]';
                // [복구됨] 칼럼 선택 기능
                return `<th onclick="toggleStatCard('${type}')" class="py-3 px-1 text-center text-xs w-10 cursor-pointer transition-colors ${activeClass}">${type}</th>`;
            }).join('');

            thead.innerHTML = `
                <tr class="text-sm text-white font-semibold">
                    <th class="py-3 px-2 text-center w-16 sticky left-0 bg-[#1e293b] z-40 border-b border-[#334155]">회차</th>
                    <th class="py-3 px-2 text-center sticky bg-[#1e293b] z-40 w-[240px] border-b border-[#334155]" style="left: 64px;">당첨번호</th>
                    ${cols}
                </tr>
            `;

            const container = document.getElementById('drawsList');
            container.innerHTML = '';

            let displayedCount = 0;

            draws.forEach((draw, index) => {
                displayedCount++;

                const tr = document.createElement('tr');
                tr.setAttribute('data-round', draw.round);

                // [New] 행 하이라이트 조건 (보라색 테마)
                const isRecent = highlightStartRound !== null && draw.round <= highlightStartRound && draw.round > highlightStartRound - 10;

                tr.className = isRecent ? 'row-highlight' : 'border-b border-gray-100 hover:bg-gray-50 cursor-pointer transition-colors';
                tr.onclick = () => highlightRecent10Rows(draw.round);

                // 당첨번호 공 생성
                const ballsHtml = draw.numbers.map(num => {
                    const gungKey = Math.ceil(num / 5) + '궁';
                    let type = '';
                    if (selectedGraphType && selectedGraphType === gungKey) {
                        type = selectedGraphType;
                    }

                    if (type) {
                        const color = gungColors[type];
                        return `<span class="w-7 h-7 flex items-center justify-center rounded-full text-[11px] mx-0.5 font-bold shadow-sm" style="background-color: ${color}; color: white;">${String(num).padStart(2, '0')}</span>`;
                    } else {
                        return `<span class="ball-normal w-7 h-7 text-[11px] mx-0.5 font-bold shadow-sm">${String(num).padStart(2, '0')}</span>`;
                    }
                }).join('');

                // 9궁 카운트 열 생성
                let countsHtml = '';
                Object.keys(gungDefinitions).forEach(type => {
                    const count = draw.counts[type];
                    const gap = draw.gaps[type];

                    let badgeClass = '';
                    let content = '';
                    let textColor = 'text-gray-400';

                    // 열 전체 하이라이트 적용
                    const isColActive = (selectedGraphType === type);
                    const colClass = isColActive ? 'col-active' : '';

                    if (count > 0) {
                        if (count === 1) badgeClass = 'bg-blue-100 text-blue-700 font-black'; // 1개: 블루
                        else if (count === 2) badgeClass = 'bg-orange-100 text-orange-700 font-black'; // 2개: 주황
                        else if (count === 3) badgeClass = 'bg-purple-100 text-purple-700 font-black'; // 3개: 보라
                        else if (count === 4) badgeClass = 'bg-pink-100 text-pink-700 font-black'; // 4개: 핑크
                        else if (count >= 5) badgeClass = 'bg-amber-100 text-amber-800 font-black'; // 5개+: 갈색
                        content = count;
                        textColor = '';
                    } else {
                        // 미출현 (0개) -> colored gap logic from consecutive_number
                        badgeClass = 'bg-transparent font-bold text-[11px]';
                        if (gap === 0) textColor = 'text-gray-300';
                        else if (gap <= 5) textColor = 'text-blue-600 font-medium';
                        else if (gap <= 10) textColor = 'text-yellow-600 font-medium';
                        else if (gap <= 20) textColor = 'text-orange-600 font-bold';
                        else textColor = 'text-red-600 font-bold';
                        content = gap;
                    }

                    // 셀 하이라이트 적용
                    const highlightClass = getHighlightClass(type, count);
                    if (highlightClass) {
                        badgeClass = highlightClass;
                        textColor = ''; // 하이라이트 시 텍스트 색상 무시
                    }

                    countsHtml += `<td class="py-3 px-1 text-center ${colClass}">
                        <span class="count-badge ${badgeClass} ${textColor}" onclick="event.stopPropagation(); toggleCellHighlight('${type}', ${count})">
                            ${content}
                        </span>
                    </td>`;
                });

                tr.innerHTML = `
                    <td class="py-3 px-2 text-center text-sm font-bold text-gray-900 sticky left-0 bg-inherit z-10 border-r border-gray-100">${draw.round}회</td>
                    <td class="py-3 px-2 text-center sticky bg-inherit z-10 w-[240px] border-r border-gray-50" style="left: 64px;"><div class="flex items-center justify-center">${ballsHtml}</div></td>
                    ${countsHtml}
                `;
                container.appendChild(tr);
            });

            // [추가] 실제 필터링된 결과 건수 UI 반영
            document.getElementById('displayedCount').textContent = displayedCount;
        }

        // 🔹 하이라이트 토글
        function toggleCellHighlight(col, val) {
            markManual(); // [수정] markManual 공통 함수 사용
            if (selectedHighlight.col === col && selectedHighlight.val === val) {
                selectedHighlight = { col: null, val: null };
            } else {
                selectedHighlight = { col: col, val: val };
            }
            applyFilter(); // 리렌더링 유도
        }

        function getHighlightClass(col, val) {
            if (selectedHighlight.col === col && selectedHighlight.val === val) {
                return 'val-highlight';
            }
            return '';
        }

        function highlightRecent10Rows(round) {
            markManual(); // [수정] markManual 공통 함수 사용
            // [New] 토글 기능: 동일 회차 재클릭 시 해제
            if (highlightStartRound === round) {
                highlightStartRound = null;
                document.querySelectorAll('tr[data-round]').forEach(row => {
                    row.classList.remove('row-highlight');
                });
                return;
            }
            // 기존 하이라이트 제거
            document.querySelectorAll('tr[data-round]').forEach(row => {
                row.classList.remove('row-highlight');
            });
            highlightStartRound = round;
            // 클래스 직접 조작 (성능 최적화)
            const container = document.getElementById('drawsList');
            Array.from(container.children).forEach(row => {
                const rowRound = parseInt(row.getAttribute('data-round'));
                if (rowRound <= round && rowRound > round - 10) {
                    row.classList.add('row-highlight');
                }
            });
        }

        // --- 차트 ---
        function setChartTab(tab) {
            chartTab = tab;
            const btnRate = document.getElementById('tabRate');
            const btnTrend = document.getElementById('tabTrend');

            if (tab === 'rate') {
                btnRate.className = 'px-4 py-2 text-sm font-medium bg-blue-500 text-white rounded-lg transition-colors';
                btnTrend.className = 'px-4 py-2 text-sm font-medium bg-gray-200 text-gray-700 rounded-lg transition-colors';
                document.getElementById('rateChartContainer').classList.remove('hidden');
                document.getElementById('rateChartContainer').classList.add('flex');
                document.getElementById('trendChartContainer').classList.add('hidden');
            } else {
                btnRate.className = 'px-4 py-2 text-sm font-medium bg-gray-200 text-gray-700 rounded-lg transition-colors';
                btnTrend.className = 'px-4 py-2 text-sm font-medium bg-blue-500 text-white rounded-lg transition-colors';
                document.getElementById('rateChartContainer').classList.add('hidden');
                document.getElementById('rateChartContainer').classList.remove('flex');
                document.getElementById('trendChartContainer').classList.remove('hidden');
                updateTrendChart();
            }
        }

        function changeGraphType(type) {
            markManual(); // [수정] markManual 공통 함수 사용
            if (selectedGraphType !== type) {
                selectedGraphType = type;
                updateStatCardStyles();

                const displayData = allDrawData.slice(0, currentRange);
                renderDrawsList(displayData);
                updateCharts(displayData);
                initDeepInsight();
            }
        }

        function updateCharts(data) {
            updateRateChart(data);
            if (chartTab === 'trend') updateTrendChart();
        }

        function updateRateChart(data) {
            const total = data.length;
            const graphTarget = selectedGraphType || '1궁';

            const counts = [0, 0, 0, 0, 0, 0]; // 0~5개
            data.forEach(d => {
                const val = d.counts[graphTarget];
                if (val !== undefined && val <= 5) counts[val]++;
            });

            const maxPct = Math.max(...counts.map(c => c / total * 100));
            const barColor = gungColors[graphTarget] || '#3B82F6';

            // [New] 가로선 배경 추가 (Grid Lines) - 삭제됨
            const container = document.getElementById('rateChartContainer');
            container.style.backgroundImage = 'none';
            // container.style.backgroundSize = '100% 20%';

            let html = '';
            for (let i = 0; i <= 5; i++) {
                const pct = (counts[i] / total * 100).toFixed(1);
                const height = maxPct > 0 ? (counts[i] / total * 100 / maxPct * 85) : 0;

                html += `<div class="flex flex-col items-center flex-1 h-full justify-end group cursor-pointer" onclick="event.stopPropagation();">
                    <div class="flex-1 w-full px-1 sm:px-2 flex flex-col items-center justify-end border-b border-gray-400">
                        <span class="text-xs font-bold text-gray-600 mb-1 group-hover:scale-110 transition-transform">${pct}%</span>
                        <div class="w-full max-w-[40px] rounded-t-lg transition-all duration-500 relative group-hover:opacity-80 shadow-sm" style="height: ${Math.max(height, 2)}%; background-color: ${barColor}"></div>
                    </div>
                    <span class="text-xs text-gray-500 mt-2 font-medium">${i}개</span>
                </div>`;
            }
            container.innerHTML = html;
        }

        function updateTrendChart() {
            const data = allDrawData.slice(0, currentRange).reverse();
            const labels = data.map(d => d.round + '회');
            const graphTarget = selectedGraphType || '1궁';
            const values = data.map(d => d.counts[graphTarget]);
            const color = gungColors[graphTarget] || '#3B82F6';

            if (trendChartInstance) trendChartInstance.destroy();
            const ctx = document.getElementById('trendChart').getContext('2d');

            trendChartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: graphTarget,
                        data: values,
                        borderColor: color,
                        backgroundColor: color + '20',
                        borderWidth: 2,
                        tension: 0.3,
                        pointRadius: 2,
                        fill: true
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        y: {
                            beginAtZero: true,
                            max: 5,
                            ticks: { stepSize: 1 },
                            grid: { display: false }
                        },
                        x: {
                            display: true,
                            ticks: { maxTicksLimit: 10 },
                            grid: { display: false }
                        }
                    }
                }
            });
        }

        // --- 공통 유틸리티 ---
        function updateSliderBackground(value) {
            const total = allDrawData.length || 1203;
            const slider = document.getElementById('rangeSlider');
            if (slider) {
                const percent = ((value - 10) / (total - 10)) * 100;
                slider.style.setProperty('--value-percent', percent + '%');
            }
        }

        function setRange(value) {
            const maxVal = allDrawData.length || 1203;
            const safeValue = value > maxVal ? maxVal : value;
            document.getElementById('rangeSlider').value = safeValue;
            updateRange(safeValue);
        }

        function updatePresetButtons(value) {
            const maxVal = allDrawData.length;
            const buttons = { 50: 'preset50', 100: 'preset100', 500: 'preset500', 1203: 'preset1203' };
            Object.keys(buttons).forEach(key => {
                const btn = document.getElementById(buttons[key]);
                const targetValue = key === '1203' ? maxVal : parseInt(key);
                if (targetValue === value) btn.className = 'px-3 py-1.5 text-sm font-medium bg-blue-500 text-white rounded-lg transition-colors';
                else btn.className = 'px-3 py-1.5 text-sm font-medium bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-lg transition-colors';
            });
        }




        function applyFilterManual() {
            markManual(); // [수정] 수동 입력 시 최근10 해제
            applyFilter();
        }

        async function applyFilter() {
            await saveFilterSettings();

            const displayData = allDrawData.slice(0, currentRange);

            renderDrawsList(displayData);
            updateCharts(displayData);
            updateStats(displayData);
            initDeepInsight();
        }

        // [표준화] 최근 10회차 필터 자동 적용
        function applyRecent10Filters() {
            const btn = document.getElementById('recent10FilterBtn');
            const btnText = document.getElementById('recent10BtnText');

            // 토글: 이미 켜져있으면 끄기
            if (isRecentTenFilter) {
                deactivateRecent10IfActive(); // [수정] 공통 함수 사용
                return;
            }

            if (!allDrawData || allDrawData.length < 10) return;

            // 1. 최근 10회차 데이터 수집
            const recent10 = allDrawData.slice(0, 10);

            // 2. 9궁별 Min/Max 적용
            Object.keys(gungDefinitions).forEach(type => {
                const values = recent10.map(d => d.counts[type]);
                const min = Math.min(...values);
                const max = Math.max(...values);

                const minInput = document.getElementById(`min_${type}`);
                const maxInput = document.getElementById(`max_${type}`);
                if (minInput) minInput.value = min;
                if (maxInput) maxInput.value = max;
            });

            // 3. UI 업데이트 (보라색 토글)
            isRecentTenFilter = true; // [추가] 상태값 업데이트
            btn.classList.remove('from-blue-500', 'to-blue-600');
            btn.classList.add('from-purple-500', 'to-purple-700');
            btnText.textContent = '필터 해제';

            const chk = document.getElementById('applyFilterCheck');
            if (chk) chk.checked = true;

            // 4. 리스트 갱신 및 하이라이트
            highlightStartRound = allDrawData[0].round;
            applyFilter();

            console.log('최근 10회차 마방진(9궁) 필터 적용 완료');
        }

        // [New] 사용자 AI 질문 처리 (사이드바 연동)
        async function submitCustomAIAnalysis() {
            const inputEl = document.getElementById('aiUserPrompt');
            const userPrompt = inputEl.value.trim();
            if (!userPrompt) return;

            // NLP 처리 (선택사항)
            let nlpResult = window.nlpProcessor ? window.nlpProcessor.process(userPrompt) : null;
            if (nlpResult && nlpResult.intent !== 'unknown' && nlpResult.confidence > 0.6) {
                if (nlpResult.intent === 'navigate') {
                    highlightRecent10Rows(nlpResult.params.targetRound || 0);
                    inputEl.value = '';
                    return;
                }
            }

            // 사이드바 열기
            if (window.openQnaModal) window.openQnaModal();

            // 질문 추가
            const qnaContent = document.getElementById('aiQnaContent');
            qnaContent.innerHTML += `<div class="flex justify-end mb-4"><div class="bg-blue-600 text-white px-4 py-2 rounded-2xl shadow-sm text-sm">${userPrompt}</div></div>`;

            const uniqueId = 'ai-res-' + Date.now();
            qnaContent.innerHTML += `<div class="flex mb-4"><div class="w-7 h-7 rounded-full bg-blue-500 flex items-center justify-center text-white text-[10px] mr-2 flex-shrink-0">AI</div><div id="${uniqueId}" class="bg-white border text-gray-800 px-4 py-2 rounded-2xl shadow-sm text-sm min-h-[40px] flex-1"></div></div>`;

            inputEl.value = '';

            // AI 호출
            const recentPatterns = allDrawData.slice(0, 5).map(draw => {
                const counts = Array(9).fill(0);
                draw.numbers.forEach(n => {
                    Object.keys(gungDefinitions).forEach((key, idx) => {
                        if (gungDefinitions[key].includes(n)) counts[idx]++;
                    });
                });
                const hitInfo = counts.map((cnt, idx) => cnt > 0 ? `${idx + 1}궁(${cnt})` : null).filter(Boolean).join(', ');
                return `[${draw.round}회: ${hitInfo}]`;
            }).join('\n');

            // [Rich Stats Calculation]
            const dataRaw = allDrawData.slice(0, currentRange);
            const stats = {};
            Object.keys(gungDefinitions).forEach(k => {
                const vals = dataRaw.map(d => d.counts[k]);
                const sum = vals.reduce((a, b) => a + b, 0);
                const avg = (sum / vals.length).toFixed(2);
                const variance = vals.reduce((a, b) => a + Math.pow(b - avg, 2), 0) / vals.length;
                const std = Math.sqrt(variance).toFixed(2);
                stats[k] = { avg, std };
            });

            const statsStr = Object.entries(stats)
                .map(([k, v]) => `- ${k}: 평균 ${v.avg} / 편차 ${v.std}`)
                .join('\n');

            await executeLocalAIAnalysis({
                containerId: uniqueId,
                subjectRound: allDrawData[0]?.round || 0,
                targetRound: (allDrawData[0]?.round || 0) + 1,
                userPrompt: userPrompt,
                contextData: `최근 5회 9궁 패턴:\n${recentPatterns}\n\n[구간별 상세 통계 (${currentRange}회 기준)]\n${statsStr}`
            });

            qnaContent.scrollTop = qnaContent.scrollHeight;
        }

        /**
         * [표준화] AI 프리미엄 전략 리포트 초기화
         * 디자인 로직과 7개 모델 앙상블 전략을 프로젝트 표준과 100% 동기화합니다.
         */
        async function initDeepInsight() {
            const gungType = selectedGraphType || '1궁';
            const containerId = 'premiumInsight';
            
            // 1. 최근 30회차 실측 데이터 추출 (흐름 진단용)
            if (!allDrawData || allDrawData.length === 0) return;
            const recentValues = allDrawData.slice(0, 30).map(d => d.counts[gungType]);

            // 2. 상단 탭 정의 (1궁~9궁)
            const tabItems = Object.keys(gungDefinitions).map(type => ({
                key: type,
                label: type
            }));

            // 3. 표준 엔진 호출 (PremiumInsightPanel.js)
            if (window.PremiumInsightPanel) {
                await window.PremiumInsightPanel.render(containerId, gungType, gungType, {
                    recentValues: recentValues,
                    skipMenuFetch: true,
                    tabs: {
                        items: tabItems,
                        activeKey: gungType,
                        onSelect: (key) => {
                            toggleStatCard(key); // 탭 클릭 시 스탯 카드 및 그래프와 동기화
                        }
                    }
                });
            }
        }

        async function executeLocalAIAnalysis(params) {
            try {
                const containerId = params.containerId;
                const container = document.getElementById(containerId);

                if (container) {
                    container.innerHTML = `
                        <div class="flex flex-col items-center justify-center p-4 min-h-[60px]">
                            <span class="material-symbols-outlined animate-spin text-blue-600 mb-2">progress_activity</span>
                            <span class="text-xs text-gray-500">AI가 분석 중입니다...</span>
                        </div>
                    `;
                }

                // AIProxy 우선 → Edge Function fallback
                let data, error;
                if (window.AIProxy) {
                    try {
                        data = await window.AIProxy.invoke({
                            prompt: params.userPrompt || params.contextData,
                            analysisType: 'magic_square',
                            topic: '9궁 분석',
                            targetRound: params.targetRound,
                            subjectRound: params.subjectRound,
                            responseStyle: 'chat'
                        });
                    } catch (proxyErr) {
                        console.warn('AIProxy failed, falling back to Edge Function:', proxyErr);
                        const result = await window.supabaseClient.functions.invoke('analyze-lotto', {
                            body: { context: params.contextData, prompt: params.userPrompt }
                        });
                        data = result.data;
                        error = result.error;
                    }
                } else {
                    const result = await window.supabaseClient.functions.invoke('analyze-lotto', {
                        body: { context: params.contextData, prompt: params.userPrompt }
                    });
                    data = result.data;
                    error = result.error;
                }
                if (error) throw error;

                if (container && data) {
                    let content = '';
                    if (typeof data === 'string') {
                        try {
                            const parsed = JSON.parse(data);
                            content = parsed.response || parsed.answer || parsed.message || JSON.stringify(parsed);
                        } catch (e) {
                            content = data;
                        }
                    } else {
                        content = data.response || data.answer || data.message || JSON.stringify(data);
                    }
                    content = content.replace(/\n/g, '<br>');
                    if (window.AIAnalysis && typeof window.AIAnalysis.formatText === 'function') {
                        content = window.AIAnalysis.formatText(content);
                    }
                    container.innerHTML = `<div class="prose prose-sm max-w-none text-gray-800 leading-relaxed break-words">${content}</div>`;
                }

            } catch (error) {
                console.error("Local Analysis Error:", error);
                if (params.containerId) {
                    const el = document.getElementById(params.containerId);
                    if (el) {
                        el.innerHTML = `<div class="text-red-500 text-xs p-2">Error: ${error.message}</div>`;
                    }
                }
            }
        }
    </script>

    <script>
        function openQnaModal() {
            const modal = document.getElementById('aiQnaModal');
            if (!modal) return;
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('translate-x-full');
                modal.classList.add('translate-x-0');
            }, 10);
            setTimeout(() => {
                const input = document.getElementById('aiModalInput');
                if (input) input.focus();
            }, 300);
        }

        // [New] Global Chat Memory
        let chatHistory = [];

        function closeQnaModal() {
            const modal = document.getElementById('aiQnaModal');
            if (!modal) return;
            modal.classList.remove('translate-x-0');
            modal.classList.add('translate-x-full');
            setTimeout(() => {
                modal.classList.add('hidden');
                // Optional: Clear history on close if desired, but better to keep for session
            }, 300);
        }

        async function submitModalFollowUp() {
            const input = document.getElementById('aiModalInput');
            if (!input) return;
            const val = input.value.trim();
            if (!val) return;

            // 1. Add User Message
            const qnaContent = document.getElementById('aiQnaContent');
            qnaContent.innerHTML += `<div class="flex justify-end mb-4"><div class="bg-blue-600 text-white px-4 py-2 rounded-2xl shadow-sm text-sm break-words max-w-[80%]">${val}</div></div>`;

            // 2. Create AI Response Placeholder
            const uniqueId = 'ai-res-' + Date.now();
            qnaContent.innerHTML += `<div class="flex mb-4"><div class="w-7 h-7 rounded-full bg-blue-500 flex items-center justify-center text-white text-[10px] mr-2 flex-shrink-0">AI</div><div id="${uniqueId}" class="bg-white border text-gray-800 px-4 py-2 rounded-2xl shadow-sm text-sm min-h-[40px] flex-1 shadow-sm"></div></div>`;

            input.value = '';
            qnaContent.scrollTop = qnaContent.scrollHeight;

            // 3. Prepare Context
            const recentLimit = 10;
            const recentData = allDrawData.slice(0, recentLimit);
            const summaryStr = recentData.map(d => `${d.round}회`).join(', '); // Simplified context for speed

            // Append chat history (Lite version)
            const memoryContext = chatHistory.slice(-5).map(msg =>
                `${msg.role === 'user' ? 'User' : 'AI'}: ${msg.content}`
            ).join('\n');

            // 4. Call Local Analysis
            await executeLocalAIAnalysis({
                containerId: uniqueId,
                subjectRound: allDrawData[0]?.round || 0,
                targetRound: (allDrawData[0]?.round || 0) + 1,
                userPrompt: val,
                contextData: `[대화 내역]\n${memoryContext}\n\n[최근 회차]\n${summaryStr}`
            });

            qnaContent.scrollTop = qnaContent.scrollHeight;
        }
    </script>
